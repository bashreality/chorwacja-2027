<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRO 2027">
<meta name="theme-color" content="#0c1220">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Chorwacja 2027</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--f:'DM Sans',system-ui,sans-serif;--fs:'Playfair Display',Georgia,serif;
--z:#0ea5e9;--s:#a855f7;--b:#f97316;--d:#10b981;
--bg:#fafaf9;--card:#fff;--brd:#e7e5e4;--tx:#1c1917;--tx2:#78716c;--tx3:#a8a29e;
--r:16px;--sh:0 1px 3px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.06)}
html{font-family:var(--f);color:var(--tx);scroll-behavior:smooth;background:var(--bg)}
body{overflow-x:hidden}
button{font-family:var(--f);cursor:pointer;border:none;background:none}

.hero{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;
position:relative;overflow:hidden;background:#0c1220;color:#fff;text-align:center;padding:40px 24px}
.hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,#0c1220 0%,#164e63 30%,#0e7490 50%,#0891b2 65%,#f59e0b 85%,#ea580c 100%);opacity:.7;animation:hs 20s ease-in-out infinite alternate}
@keyframes hs{0%{filter:hue-rotate(0) brightness(1)}50%{filter:hue-rotate(-15deg) brightness(1.1)}100%{filter:hue-rotate(10deg) brightness(.95)}}
.hero-ov{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 80%,rgba(0,0,0,.3),transparent 70%)}
.hero-c{position:relative;z-index:1;max-width:800px}
.hero-c .flag{font-size:56px;margin-bottom:20px;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
.hero h1{font-family:var(--fs);font-size:clamp(36px,7vw,72px);font-weight:800;line-height:1.1;letter-spacing:-1px;margin-bottom:12px;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.hero .sub{font-size:clamp(14px,2.5vw,20px);opacity:.7;margin-bottom:36px;letter-spacing:1px}
.hero-st{display:flex;gap:32px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.hero-st div{text-align:center}
.hero-st .v{font-family:var(--fs);font-size:clamp(28px,4vw,44px);font-weight:700;display:block;line-height:1.2}
.hero-st .l{font-size:12px;opacity:.5;text-transform:uppercase;letter-spacing:2px;margin-top:2px}
.hero-rt{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;font-size:clamp(13px,2vw,16px);font-weight:600;opacity:.8}
.hero-rt .a{opacity:.3;font-size:18px}
.hero-sc{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);z-index:1;font-size:12px;opacity:.4;letter-spacing:2px;text-transform:uppercase;animation:bd 2s ease-in-out infinite}
@keyframes bd{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

.tn{position:sticky;top:0;z-index:50;background:rgba(250,250,249,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--brd);padding:0 24px;transition:box-shadow .3s}
.tn.sc{box-shadow:0 1px 8px rgba(0,0,0,.06)}
.tn-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;height:56px;gap:4px}
.tn-br{font-family:var(--fs);font-weight:700;font-size:18px;margin-right:auto;white-space:nowrap}
.tn-br span{opacity:.4;font-weight:400}
.tb{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--tx2);transition:all .2s;white-space:nowrap}
.tb:hover{background:rgba(0,0,0,.04)}.tb.on{color:var(--tx);background:rgba(0,0,0,.06)}
.tn-pg{display:flex;align-items:center;gap:8px;margin-left:12px}
.tn-bar{width:80px;height:4px;background:var(--brd);border-radius:2px;overflow:hidden}
.tn-fl{height:100%;border-radius:2px;background:var(--d);transition:width .5s}
.tn-pc{font-size:13px;font-weight:700;color:var(--d)}
@media(max-width:768px){.tb{padding:6px 8px;font-size:11px}.tn-pg{display:none}.tn-in{gap:1px}}

.sec{display:none;max-width:900px;margin:0 auto;padding:32px 20px 80px}.sec.on{display:block}

.ci{margin-bottom:32px;padding:40px 0 32px;border-bottom:1px solid var(--brd)}
.ci .cl{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
.cl.zadar{color:var(--z)}.cl.split{color:var(--s)}.cl.brela{color:var(--b)}.cl.dubrovnik{color:var(--d)}
.ci h2{font-family:var(--fs);font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.15;letter-spacing:-1px;margin-bottom:6px}
.ci .cm{font-size:15px;color:var(--tx2)}

.dc{position:relative;margin-bottom:16px;background:var(--card);border:1px solid var(--brd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:all .25s}
.dc:hover{box-shadow:0 2px 6px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.08)}
.dc.dn{border-color:rgba(16,185,129,.25);background:linear-gradient(135deg,#f0fdf4,#ecfdf5)}

.dh{display:flex;align-items:center;gap:14px;padding:18px 20px;cursor:pointer;-webkit-user-select:none}
.dd{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--fs);font-weight:800;font-size:16px;color:#fff;flex-shrink:0}
.dd.zadar{background:var(--z)}.dd.split{background:var(--s)}.dd.brela{background:var(--b)}.dd.dubrovnik{background:var(--d)}
.dc.dn .dd{background:var(--d)}
.dh-i{flex:1;min-width:0}
.dh-dt{font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:2px}
.dh-t{font-size:16px;font-weight:700;line-height:1.3}
.dh-s{font-size:13px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.dh-p{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;background:#f5f5f4;color:var(--tx3)}
.dc.dn .dh-p{background:rgba(16,185,129,.1);color:var(--d)}
.dh-a{font-size:20px;color:var(--tx3);transition:transform .3s}
.dc.op .dh-a{transform:rotate(90deg)}

.db{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.4,0,.2,1)}
.dc.op .db{max-height:6000px}
.db-in{padding:0 20px 24px}
.db-dv{height:1px;background:var(--brd);margin-bottom:20px}

.ti{display:flex;gap:14px;position:relative;padding-bottom:14px}
.ti:last-of-type{padding-bottom:0}
.tl{position:relative;width:20px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.tl::before{content:'';position:absolute;top:12px;bottom:0;width:1.5px;background:var(--brd)}
.ti:last-of-type .tl::before{display:none}
.tc{width:20px;height:20px;border:2px solid #d6d3d1;border-radius:6px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:1;flex-shrink:0}
.tc:hover{border-color:#a8a29e}.tc:active{transform:scale(.9)}
.tc.on{background:var(--d);border-color:var(--d)}
.tc.on::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ti-c{flex:1;min-width:0;padding-top:1px}
.ti-t{font-size:12px;font-weight:700;color:var(--tx);margin-bottom:2px}
.ti-d{font-size:14px;color:var(--tx2);line-height:1.5}
.ti.ck .ti-d{text-decoration:line-through;opacity:.4}

.rc{display:flex;gap:12px;background:#fffbeb;border:1px solid #fef3c7;border-radius:12px;padding:12px 14px;margin:8px 0 4px}
.rc .ri{font-size:20px;flex-shrink:0}.rc .rn{font-weight:700;font-size:13px}.rc .rd{font-size:12px;color:var(--tx2);margin-top:2px;line-height:1.4}

.wn{display:flex;gap:10px;background:#f0f9ff;border:1px solid #e0f2fe;border-radius:12px;padding:12px 14px;margin-top:16px;font-size:13px;color:#0c4a6e;line-height:1.5}
.wn span:first-child{flex-shrink:0;font-size:16px}

.sn{display:flex;gap:10px;background:#fdf4ff;border:1px solid #f5d0fe;border-radius:12px;padding:12px 14px;margin-top:8px;font-size:13px;color:#86198f;line-height:1.5}
.sn span:first-child{flex-shrink:0;font-size:16px}

.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.mc{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.mc h3{font-family:var(--fs);font-size:20px;font-weight:700;margin-bottom:16px}
.mi{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f5f5f4}.mi:last-child{border-bottom:none}
.mi .me{font-size:20px;flex-shrink:0;width:28px;text-align:center}
.mi .mn{font-weight:700;font-size:13px}.mi .md{font-size:12px;color:var(--tx2)}
.noc{margin-top:20px}.noc .md a{color:var(--d);font-weight:600;text-decoration:none}.noc .nt{font-size:12px;color:var(--tx3);margin-top:10px;line-height:1.5}
.noc .mk{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin:14px 0 4px}.pht a,.nt a{color:var(--d)}.ti-d a,.wn a,.sn a,.rd a{color:var(--d);font-weight:600}
.pht{width:100%;border-collapse:collapse;font-size:13px}
.pht th{text-align:left;padding:8px 4px;font-size:11px;color:var(--tx3);border-bottom:2px solid var(--brd);font-weight:700}
.pht td{padding:8px 4px;border-bottom:1px solid #f5f5f4}.pht td:last-child{color:var(--tx2);font-style:italic}

.ft{text-align:center;padding:48px 24px;border-top:1px solid var(--brd);color:var(--tx3);font-size:13px}
.ft .ff{font-size:32px;margin-bottom:8px;display:block}

/* === PHOTOS === */
.ti-wrap{display:flex;gap:12px;align-items:flex-start}
.ti-c{flex:1;min-width:0}
.ti-ph{width:80px;height:60px;border-radius:10px;object-fit:cover;flex-shrink:0;cursor:pointer;
background:#e7e5e4;transition:transform .2s,opacity .3s;box-shadow:0 2px 8px rgba(0,0,0,.1);opacity:0}
.ti-ph.loaded{opacity:1}
.ti-ph:hover{transform:scale(1.05)}
@media(min-width:640px){.ti-ph{width:100px;height:72px}}

/* === LIGHTBOX === */
.lb{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:flex;align-items:center;
justify-content:center;flex-direction:column;gap:12px;padding:20px;cursor:pointer;
opacity:0;pointer-events:none;transition:opacity .25s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.lb.show{opacity:1;pointer-events:auto}
.lb img{max-width:100%;max-height:75vh;border-radius:14px;object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.lb-cap{color:rgba(255,255,255,.7);font-size:14px;text-align:center;max-width:500px}
.lb-close{position:absolute;top:20px;right:20px;color:#fff;font-size:28px;opacity:.5;cursor:pointer;
width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;
background:rgba(255,255,255,.1);transition:opacity .2s}
.lb-close:hover{opacity:1}

@media(max-width:640px){.ci{padding:24px 0 20px}.dh{padding:14px 16px;gap:10px}.db-in{padding:0 16px 20px}.mg{grid-template-columns:1fr}}
</style>
</head>
<body>

<section class="hero">
<div class="hero-bg"></div><div class="hero-ov"></div>
<div class="hero-c">
<span class="flag">🇭🇷</span>
<h1>Chorwacja 2027</h1>
<p class="sub">18 czerwca – 4 lipca 2027 · Adriatycka przygoda zaplanowana co do godziny</p>
<div class="hero-st">
<div><span class="v">17</span><span class="l">Dni</span></div>
<div><span class="v">4</span><span class="l">Miasta</span></div>
<div><span class="v">16</span><span class="l">Nocy</span></div>
<div><span class="v" id="hp">0%</span><span class="l">Gotowe</span></div>
</div>
<div class="hero-rt"><span>Zadar</span><span class="a">&rarr;</span><span>Split</span><span class="a">&rarr;</span><span>Brela</span><span class="a">&rarr;</span><span>Dubrownik</span></div>
</div>
<div class="hero-sc">&darr; Przewijaj</div>
</section>

<nav class="tn" id="tn"><div class="tn-in">
<div class="tn-br">CRO <span>'27</span></div>
<button class="tb on" data-c="zadar" onclick="go(this)">Zadar</button>
<button class="tb" data-c="split" onclick="go(this)">Split</button>
<button class="tb" data-c="brela" onclick="go(this)">Brela</button>
<button class="tb" data-c="dubrovnik" onclick="go(this)">Dubrownik</button>
<button class="tb" data-c="more" onclick="go(this)">Wiecej</button>
<div class="tn-pg"><div class="tn-bar"><div class="tn-fl" id="nf"></div></div><span class="tn-pc" id="np">0%</span></div>
</div></nav>

<div class="sec on" id="s-zadar"></div>
<div class="sec" id="s-split"></div>
<div class="sec" id="s-brela"></div>
<div class="sec" id="s-dubrovnik"></div>
<div class="sec" id="s-more"></div>

<div class="lb" id="lb" onclick="closeLb()"><div class="lb-close">&times;</div><img id="lb-img"><div class="lb-cap" id="lb-cap"></div></div>
<footer class="ft"><span class="ff">🇭🇷</span><p><b>Zivjeli!</b> &mdash; Chorwacja 2027</p><p style="margin-top:4px">Zadar &rarr; Split &rarr; Brela &rarr; Dubrownik</p><p style="margin-top:12px;font-size:11px;opacity:.6">iPhone: Share &rarr; Add to Home Screen</p></footer>

<script>
const D=[
// ===== ZADAR =====
{id:1,c:"zadar",dt:"Piatek, 18 czerwca",t:"Przylot i pierwszy zachod",s:"Jadera, Forum, Organy Morskie, Pozdrav Suncu",i:[
{t:"05:30–10:00",d:"Robocze okno: lotnisko w Poznaniu, nadanie wspolnej walizki, odprawa i lot do Zadaru. Zapas przed odlotem dostosuj do wymagan przewoznika | godziny zastap danymi rezerwacji — to przyklad dla wczesnego przylotu, nie potwierdzone polaczenie na 2027 | <a href=\"https://www.google.com/maps/search/?api=1&query=Zadar%20Airport\" target=\"_blank\" rel=\"noopener\">Lotnisko ZAD (mapa)</a>"},
{t:"10:00–12:00",d:"Po ladowaniu: bagaz, autobus lotniskowy i dojscie do obiektu. Lotnisko publikuje osobne rozklady miesieczne dla centrum/polwyspu i dworca — wybierz przystanek pod hotel, nie wysiadaj automatycznie przy pierwszym. Przy dlugim oczekiwaniu i zmeczeniu porownaj koszt taksowki dla 2 osob | <a href=\"https://zadar-airport.hr/kako-do-nas/\" target=\"_blank\" rel=\"noopener\">Lotnisko — transport</a>"},
{t:"12:00–13:30",d:"Zostaw walizke (po wczesniejszym uzgodnieniu) i zjedz prosty lunch przy noclegu. Na starowce: 4 Kantuna (wybor pizzy/makaronu); przy noclegu kolo Kolovare wybierz cos lokalnie i zachowaj sily na wieczor",r:{n:"4 Kantuna",d:"Pizza / makaron | Varoska 1 | 20–40 EUR/os | 4.6 | 7876 ocen"}},
{t:"13:30–17:30",d:"Zameldowanie wedlug zasad obiektu, prysznic i odpoczynek. Fosa zostaje na pelny dzien miejski"},
{t:"17:30–18:45",d:"Kolacja <b>przed</b> zachodnim koncem spaceru — nie trzeba wracac z Organow do srodka starowki. Pasticada z gnocchi albo risotto cielece, jezeli sa w karcie",r:{n:"Restaurant Jadera",d:"Brne Karnarutica 4 | pasticada z gnocchi 19 EUR | risotto cielece 17 EUR | 4.5 | zamkniete w niedziele"}},
{t:"18:45–19:30",d:"Przejscie ku Forum — bryla sw. Donata, kamienne pozostalosci placu i fasady. Wnetrza poczekaja do jutra"},
{t:"19:30–21:15",d:"Promenada nad morzem do <b>Organow Morskich</b>, potem sasiedni <b>Pozdrav Suncu</b> — jeden zespol nad woda. Usiadzcie, posluchajcie fal; instalacje swietlna najlepiej ocenic po sciemnieniu. Okno obejmuje oczekiwanie, nie jest wyliczona godzina zachodu | Foto: od Forum ostatni fragment przejdz przy wodzie, kadr wzdluz schodow Organow laczy morze i ludzi | <a href=\"https://zadar.travel/attractions/attractions/organo-marino\" target=\"_blank\" rel=\"noopener\">Opis informacji turystycznej</a>"},
{t:"21:15–21:45",d:"Najkrotszy powrot do noclegu. Przy poznym przylocie caly wieczor skroc do jedzenia i jednego nadmorskiego punktu"}],
w:"Deszcz: po odpoczynku 60–90 min w Muzeum Szkla (jesli otwarte) albo kawiarnia; nabrzeze dopiero po ustaniu burzy. Odpusc: Fose, plaze, wieze i bar — nie dopisuj ich do pierwszego dnia tylko dlatego, ze przylot jest rano.",
sp:"Ten sam przylot i transfer, mniej spaceru: 05:30–10:00 lotnisko, odprawa, lot | 10:00–12:00 walizka, transfer, dojscie do noclegu | 12:00–13:00 bagaz i lunch blisko hotelu (4 Kantuna, jesli juz na starowce) | 13:00–18:00 zameldowanie, prysznic, dlugi odpoczynek | 18:00–19:00 kolacja przy hotelu (Jadera przy noclegu na polnocnej starowce) | 19:00–19:30 spokojne dojscie nad morze, bez wnetrz | 19:30–21:15 tylko Organy Morskie i Pozdrav Suncu, czekanie na wieczorne swiatlo | 21:15–21:45 najkrotszy powrot i sen.",
note:"Godziny orientacyjne, daty robocze — brak rezerwacji; poranne okna dopasuj do kupionego lotu. Trasa po odpoczynku: nocleg → Jadera → Forum → promenada → Organy Morskie → Pozdrav Suncu | spacer ok. 1,5–3 km plus hotel, latwy, plasko — najwiekszym obciazeniem jest przylot i walizka | <a href=\"https://www.google.com/maps/dir/?api=1&origin=Restaurant%20Jadera%20Zadar&destination=Greeting%20to%20the%20Sun%20Zadar&waypoints=Roman%20Forum%20Zadar%7CSea%20Organ%20Zadar&travelmode=walking\" target=\"_blank\" rel=\"noopener\">Mapa: Jadera → Forum → Organy → Pozdrav Suncu</a>"},

{id:2,c:"zadar",dt:"Sobota, 19 czerwca",t:"Zadar od targu do Fosy + Kolovare",s:"Cala starowka pieszo, po poludniu plaza Kolovare",i:[
{t:"08:00–09:00",d:"Sniadanie przy targu — obejrzyj stragany i kup owoce/prowiant na jutro juz teraz, zamiast wracac po zwiedzaniu. Trasa rano: ok. 2–3 km, latwa | <a href=\"https://www.google.com/maps/dir/?api=1&origin=Pjaceta%20Bar%20Zadar&destination=Narodni%20trg%20Zadar&waypoints=Zadar%20Cathedral%7CRoman%20Forum%20Zadar&travelmode=walking\" target=\"_blank\" rel=\"noopener\">🗺️ Czesc 1: Pjaceta → katedra → Forum → Narodni trg</a>",r:{n:"Pjaceta Bar",d:"Tost / jogurt z owocami + kawa wg aktualnej karty | Pod bedem 1A | ok. 10–14 EUR/os (budzet nie gwarantuje kazdego zestawu) | 4.6"}},
{t:"09:00–10:00",d:"Przejscie ku katedrze sw. Anastazji — wnetrze tylko w godzinach zwiedzania, z uwzglednieniem nabozenstw. Opcjonalna dzwonnica 30–45 min (osobny wysilek po schodach) zastepuje kolejne wnetrze"},
{t:"10:00–10:45",d:"Sw. Donat i Forum — jeden zespol do obejrzenia na miejscu, bez oddzielnych powrotow. Wnetrze sw. Donata tylko jesli interesuje Was architektura; widok z zewnatrz juz daje mocny obraz | <a href=\"https://zadar.travel/attractions/secret-zadar/monastery-of-st-mary\" target=\"_blank\" rel=\"noopener\">Zespol zabytkow wokol Forum</a>"},
{t:"10:45–11:30",d:"Kalelarga na poludniowy wschod do Narodni trg — kawa i ogladanie placu. Z polnocnej czesci miasta schodzicie juz konsekwentnie na poludnie"},
{t:"11:30–12:30",d:"Lunch — makaron z wolowina lub pizza. Jesli kuchnia zaczyna pozniej: najpierw krotki spacer po poludniowej starowce, potem lunch; nie wracaj do Jadery po ten sam posilek co wczoraj",r:{n:"4 Kantuna",d:"Makaron z wolowina | pizza | Varoska 1 | 20–40 EUR/os | 4.6"}},
{t:"12:30–13:15",d:"Plac Pieciu Studni → park krolowej Jeleny Madije (cien, inny poziom ogladania murow; wejscie sasiaduje z placem) → Brama Ladowa i Fosa. <b>Najlepszy maly przystanek:</b> Fosa z widokiem przez wode na mury i Brame Ladowa | <a href=\"https://zadar.travel/attractions/attractions/five-wells-square\" target=\"_blank\" rel=\"noopener\">Oficjalny opis placu i parku</a> | <a href=\"https://www.google.com/maps/dir/?api=1&origin=4%20Kantuna%20Zadar&destination=Kolovare%20Beach%20Zadar&waypoints=Five%20Wells%20Square%20Zadar%7CLand%20Gate%20Zadar&travelmode=walking\" target=\"_blank\" rel=\"noopener\">🗺️ Czesc 2: 4 Kantuna → Piec Studni → Fosa → Kolovare</a>"},
{t:"13:15–16:00",d:"Odpoczynek w noclegu. Przy noclegu blisko Kolovare po Fosie wracacie naturalnie w strone hotelu; przy hotelu na polnocy polwyspu to swiadomy powrot na sjeste, nie kolejna runda zwiedzania"},
{t:"16:00–18:00",d:"Plaza Kolovare — kapiel i odpoczynek. Dojscie od poludniowej starowki ok. 15–25 min zaleznie od fragmentu plazy. Wygodna plaza miejska — glowny pobyt plazowy czeka na Riwierze"},
{t:"18:00–19:30",d:"Prysznic i kolacja przy hotelu. Wracajac na polwysep: Bistro Pjat (czarne risotto) albo 4 Kantuna (pizza/makaron), jesli nie jedliscie tam lunchu. Przy Kolovare nie idzcie z powrotem az na polnoc tylko po jedzenie",r:{n:"Bistro Pjat",d:"Crni rizot (czarne risotto z matwa) | Stomorica 10 | 15–35 EUR/os | 4.4 | albo 4 Kantuna"}},
{t:"19:30–20:30",d:"Przygotuj prowiant, wode i lekka kurtke na Plitvice. Opcjonalnie jeden napoj w Deja Brew przy powrocie przez Borelli — bez osobnego wyjscia"}],
w:"Deszcz: Pjaceta → Muzeum Szkla Antycznego 09:30–11:00 (<a href=\"https://www.mas-zadar.hr/hr/o-muzeju/opce-informacije\" target=\"_blank\" rel=\"noopener\">adres, bilety i godziny</a>) → Narodni trg → lunch w 4 Kantuna; dalsze wnetrze tylko wedlug checi. Przy zmeczeniu odpusc najpierw: wieze, drugie wnetrze i wieczorny bar. Kolovare nie musi konczyc sie ponownym marszem do Organow.",
sp:"Krotka starowka i jeden popoludniowy cel: 09:00–10:00 sniadanie w Pjacecie albo przy hotelu | 10:00–11:30 Forum, sw. Donat z zewnatrz, najwyzej jedno wnetrze, bez wiezy | 11:30–12:00 powoli Kalelarga do Narodni trg | 12:00–13:00 lunch w 4 Kantuna | 13:00–16:30 odpoczynek w noclegu | 16:30–18:00 Fosa i krotki spacer <b>albo</b> Kolovare i kapiel (wg polozenia hotelu) | 18:00–19:00 powrot i prysznic | 19:00–20:00 kolacja przy noclegu (Pjat/4 Kantuna tylko gdy wracacie na polwysep) | 20:00–20:30 prowiant, woda i kurtka na Plitvice.",
note:"Jedyny pelny dzien w Zadarze — splyw kajakowy przeniesiono na Cetine w Omisu (dzien 29.06, z Breli). Spacer: rano ok. 2–3 km, z plaza i powrotem lacznie ok. 5–7 km + hotel, latwy (wieza to osobny wysilek po schodach). Godziny orientacyjne, brak rezerwacji."},

{id:3,c:"zadar",dt:"Niedziela, 20 czerwca",t:"Plitvice — pelny dzien wsrod jezior",s:"Kladki, wodospady, gorne i dolne jeziora z wycieczka z Zadaru",i:[
{t:"06:15–07:15",d:"Sniadanie w noclegu i dojscie na zbiorke z zapasem. Kawiarnia nie jest pewnym rozwiazaniem o tej porze — prowiant przygotuj dzien wczesniej"},
{t:"07:30–09:30",d:"Dojazd z grupa (ok. 2 h jazdy w jedna strone). Wspolna walizka zostaje w Zadarze, bierzecie male plecaki"},
{t:"09:30–10:00",d:"Toaleta, organizacja wejscia, ustalenie miejsca powrotu. Nie rezerwuj samodzielnie innego wejscia niz wybrane przez operatora | <a href=\"https://www.google.com/maps/search/?api=1&query=Plitvice%20Lakes%20Entrance%201\" target=\"_blank\" rel=\"noopener\">📍 Wejscie 1 — orientacja, nie potwierdzona zbiorka</a>"},
{t:"10:00–12:30",d:"Pierwsza czesc trasy po udostepnionych sciezkach. Kolejnosc gornych/dolnych jezior ustala program i biezaca dostepnosc"},
{t:"12:30–13:00",d:"Kanapki i owoce w wyznaczonym miejscu, w przerwie uzgodnionej z grupa. Nie uzalezniaj czasu obiadu od kolejki do restauracji"},
{t:"13:00–15:30",d:"Dalsze jeziora i parkowy transport wedlug trasy. Zdjecia rob na poszerzeniach kladek, zostawiajac przejscie innym"},
{t:"15:30–18:00",d:"Zbiorka i powrot do Zadaru, z buforem na opoznienia"},
{t:"18:00–19:30",d:"Odpoczynek i prysznic"},
{t:"19:30–20:30",d:"Kolacja blisko hotelu. Przy pozniejszym powrocie wybierz najblizsza otwarta kuchnie",r:{n:"4 Kantuna",d:"Polwysep | makaron/pizza | Jadera w niedziele zamknieta"}},
{t:"20:30–21:15",d:"Przygotowanie na rejs i sen. Nie planuj dlugiego pubowego wieczoru po calym dniu chodzenia"}],
w:"<b>Lekki deszcz:</b> Plitvice moga pozostac mozliwe — decyduja park, ostrzezenia i operator. <b>Burza lub zamkniecie:</b> zamien dzien albo wybierz lokalny program pod dachem. <b>Przy zmeczeniu odpusc:</b> wieczorne atrakcje po powrocie; krotsza trasa w samym parku wymaga wczesniejszego ustalenia.",
sp:"<b>Zamiast Plitvic zostajecie w Zadarze</b> (ok. 3–5 km + hotel; wycieczka wypada z pobytu, jesli nie da sie jej przelozyc na inny pelny dzien): 09:00–10:00 sniadanie w Pjacecie, bez wczesnej pobudki | 10:00–11:30 Muzeum Szkla albo krotki spacer po centrum (zaleznie od pogody) | 11:30–12:00 kawa lub spokojne przejscie ku poludniowej starowce | 12:00–13:00 lunch w 4 Kantuna (makaron lub pizza) | 13:00–16:00 odpoczynek w noclegu | 16:00–18:00 Kolovare i kapiel (przy gorszej pogodzie krotki spacer przy hotelu) | 18:00–19:00 powrot, prysznic, odpoczynek | 19:00–20:00 kolacja przy hotelu — 4 Kantuna na polwyspie (Jadera w niedziele zamknieta) | 20:00–20:30 przygotuj plecaki na rejs i potwierdz miejsce zbiorki.",
alt:"<b>Wybor wycieczki:</b> Travel More — referencyjny wyjazd ok. 07:30, ok. 2 h jazdy w jedna strone, ok. 5 h zwiedzania, powrot ok. 18:00. Oferta lato 2026: 80 €/dorosly, wejscie do parku w cenie (ale lista rzeczy zawiera gotowke na wejscie); jedzenie i napoje poza cena — <a href=\"https://www.morezadar-travel.com/en/our-offers/tours/nature/tour-plitvice-lakes-guided-tour-from-zadar\" target=\"_blank\" rel=\"noopener\">oferta operatora</a>. Dla porownania park: <b>program B: 4 km / 3–4 h</b>, <b>C: 8 km / 4–5 h</b> — to parametry oficjalnych tras, nie obietnica, ze grupa pojdzie wlasnie nimi. Krotsza wersje ustal przy rezerwacji; nie odlaczaj sie samodzielnie, liczac na ten sam powrot — <a href=\"https://np-plitvicka-jezera.hr/en/plan-your-visit/istrazite-jezera/activities/lake-tour-programmes/\" target=\"_blank\" rel=\"noopener\">🗺️ oficjalne programy tras</a>.",
note:"<b>Trasa:</b> nocleg → potwierdzona zbiorka w Zadarze → park i program operatora → powrot do Zadaru → kolacja przy noclegu. <b>Spacer:</b> roboczo ok. 5–10 km zaleznie od programu, umiarkowany, wielogodzinny, z kladkami, schodami i kolejkami (szacunek). <b>Przed zakupem na 2027 potwierdz na pismie pelna cene, bilet parkowy, trase oraz miejsce i godzine zbiorki.</b> <b>Zabierz:</b> buty z przyczepna podeszwa, lekka warstwe na chlodniejszy lad, kurtke przeciwdeszczowa, wode i prowiant. Kapiel w jeziorach zabroniona — <a href=\"https://np-plitvicka-jezera.hr/en/faq/\" target=\"_blank\" rel=\"noopener\">oficjalne FAQ parku</a>."},

{id:4,c:"zadar",dt:"Poniedzialek, 21 czerwca",t:"Kornati i Telascica — rejs",s:"Morze, klify i slone jezioro Mir",i:[
{t:"06:30–07:15",d:"Male sniadanie w noclegu, woda, nakrycie glowy, krem, recznik i stroj. Nawet przy kanapce w cenie rejsu warto nie wychodzic glodnym"},
{t:"07:15–08:00",d:"Dojscie na wlasciwe nabrzeze i wejscie na statek. <b>Liburnska obala nie jest portem Gazenica</b> — jedz wylacznie do punktu z potwierdzenia rezerwacji | <a href=\"https://www.google.com/maps/search/?api=1&query=Liburnska%20obala%20Zadar\" target=\"_blank\" rel=\"noopener\">📍 Liburnska obala</a>"},
{t:"08:00–11:00",d:"Rejs widokowy przez archipelag. Czesc dnia to sama zegluga — wybierz cien i spokojne miejsce do siedzenia. Kolejnosc postojow ustala kapitan"},
{t:"11:00–15:30",d:"Okno na przewidziane postoje, obiad i zwiedzanie. <b>Mieso zamow przy rezerwacji</b>, jesli jest taka opcja. W Telascicy wybierz spacer do <b>jeziora Mir</b> albo dostepnego punktu na <b>klify</b> — oba tylko przy wystarczajaco dlugim postoju. Nie zaczynaj pelnego okrazania jeziora bez policzenia czasu powrotu do lodzi | <a href=\"https://www.google.com/maps/search/?api=1&query=Lake%20Mir%20Telascica\" target=\"_blank\" rel=\"noopener\">📍 Jezioro Mir</a> | <a href=\"https://pp-telascica.hr/o-parku/?lang=en\" target=\"_blank\" rel=\"noopener\">🌿 oficjalny opis Telascicy</a>"},
{t:"15:30–18:00",d:"Powrot do Zadaru wg programu i warunkow. To nie jest dodatkowa obietnica konkretnej plazy ani kolejnosci dwoch parkow"},
{t:"18:00–19:30",d:"Odpoczynek w hotelu"},
{t:"19:30–20:30",d:"Kolacja przy noclegu. Jesli schodzicie przy moscie i nie wracacie najpierw na odpoczynek: Jadera w strone polnocnej starowki, 4 Kantuna przy przejsciu na poludnie",r:{n:"Jadera lub 4 Kantuna",d:"Jadera — kierunek polnocna starowka | 4 Kantuna — przy przejsciu na poludnie"}},
{t:"20:30–21:30",d:"Spakuj walizke, potwierdz autobus i dojscie/dojazd na dworzec. Jutro zmiana bazy!"}],
w:"Wiatr / odwolanie: zapytaj o uzgodniona zmiane lub refundacje (jesli dni 19–20.06 juz minely, rejs wypada z pobytu). Plan zastepczy: Muzeum Szkla 10:00–11:30, lunch i odpoczynek. Silny wiatr moze zatrzymac rejs mimo slonca — nie szukaj mniejszej lodzi wbrew ostrzezeniom. Przy zmeczeniu odpusc drugi cel na ladzie i wieczorne wyjscie do baru.",
sp:"Zamiast rejsu zostajecie w Zadarze (ok. 3–5 km + hotel, latwo; rejs wypada z pobytu, jesli nie odbyl sie wczesniej): 09:00–10:00 sniadanie przy hotelu | 10:00–12:00 Kolovare, kapiel i spokojne siedzenie nad morzem | 12:00–13:00 lunch przy plazy lub noclegu (otwarta kuchnia na trasie powrotu) | 13:00–16:30 odpoczynek i prysznic | 16:30–18:00 Fosa i poludniowa starowka, krotka kawa | 18:00–19:00 kolacja w 4 Kantuna albo Bistro Pjat | 19:00–20:00 spacer powrotny; Organy tylko, jesli pierwszego dnia sie nie udaly i jest energia | 20:00–21:00 pakowanie, potwierdzenie autobusu do Splitu i dojazdu na dworzec.",
alt:"Wybor rejsu wazniejszy niz nazwa: referencyjna Fazanka — caly dzien ok. 08:00–18:00, sniadanie, obiad rybny lub miesny, bilety do obu parkow; zbiorka w okolicy mostu na Liburnskiej obali (dokladne miejsce po rezerwacji); program i cena na czerwiec 2027 do potwierdzenia | <a href=\"https://fazanka-tours.hr/\" target=\"_blank\" rel=\"noopener\">oficjalna oferta Fazanki</a>. Ustal konkretne postoje i czas na ladzie — panorama Kornatow z pokladu to nie spacer po wyspach. Sakarun, Veli Rat i pelne poznanie Dugi Otok nie sa automatycznie w programie.",
note:"Trasa: nocleg → potwierdzone nabrzeze → rejs i postoje operatora → Zadar → nocleg. Spacer ok. 2–5 km na ladzie, latwy do umiarkowanego — kamieniste sciezki, slonce i wiele godzin na wodzie mecza bardziej niz dystans. Brak rezerwacji, godziny orientacyjne. Najlepsze kadry archipelagu czesto z pokladu; przy krotkim postoju jeden spokojny widok lepszy niz bieg miedzy jeziorem i klifami."},

// ===== SPLIT =====
{id:5,c:"split",dt:"Wtorek, 22 czerwca",t:"Zadar → Split i pierwsze wejscie do palacu",s:"Transfer autobusem, Brama Brazowa → Perystyl → Zlota Brama → Pjaca → Riva | spacer ok. 2–3 km, latwy (bruk, krotkie schody)",i:[
{t:"08:00–09:00",d:"Sniadanie, wymeldowanie i kontrola dokumentow/biletow. Zarezerwuj czas na zejscie z walizka i dotarcie na dworzec w Zadarze — nie zakladaj, ze autobus odjezdza z nabrzeza starego miasta. <a href=\"https://www.google.com/maps/search/?api=1&query=Autobusni%20kolodvor%20Zadar\" target=\"_blank\" rel=\"noopener\">📍 Dworzec Zadar</a>"},
{t:"09:00–10:00",d:"Dojscie/dojazd na dworzec i zapas przed wybranym kursem"},
{t:"10:00–13:30",d:"Robocze okno przejazdu Zadar → Split. Arriva: polaczenie miedzy glownymi dworcami, zwykle ok. 2–3 h jazdy; od hotelu do hotelu licz <b>ok. 3–4,5 h</b>, przy niekorzystnym kursie lub korkach wiecej | <a href=\"https://www.arriva.com.hr/hr-hr/bus-zadar-split\" target=\"_blank\" rel=\"noopener\">Oficjalna relacja Zadar–Split (Arriva)</a> | <a href=\"https://www.google.com/maps/search/?api=1&query=Autobusni%20kolodvor%20Split%20Obala%20kneza%20Domagoja%2012\" target=\"_blank\" rel=\"noopener\">📍 Dworzec dalekobiezny Split przy porcie</a>"},
{t:"13:30–14:30",d:"Zostaw bagaz i zjedz lunch. Bakra pasuje, jesli idziecie z portu w strone Lucaca/Bacvic (pizza lub cevapi). Przy noclegu na polnoc/zachod od palacu idz od razu do hotelu i zjedz w jego poblizu — Bakra nie wymaga osobnego powrotu",r:{n:"Bakra – Steak & Pizza Bar",d:"Pizza Lucac / cevapi | Majstora Radovana 2 | 15–35 EUR/os | 4.5 | 5287 ocen"}},
{t:"14:30–17:00",d:"Zameldowanie i odpoczynek. <b>Sug nie jest domyslnym wyborem na dzis</b> — 22.06 to swieto panstwowe w Chorwacji: godziny lokali i autobusow sprawdz wczesniej, Sug lepiej na kolejny wieczor | <a href=\"https://sug.hr/menu/\" target=\"_blank\" rel=\"noopener\">Strona Sug</a>"},
{t:"17:00–18:00",d:"Start przy wschodniej czesci <b>Rivy</b>, wejscie przez <b>Brame Brazowa</b> i centralny ciag podziemi ku <b>Perystylowi</b>. Jesli przejscie niedostepne — wejdz od strony Srebrnej Bramy. Pelne platne sale podziemi zostaja na dzien 24.06 lub deszcz"},
{t:"18:00–18:45",d:"<b>Vestibul</b> obok Perystylu → uliczki palacu → <b>Zlota Brama</b>. Dzis ogladacie przestrzen miasta, nie wszystkie platne obiekty. Krotki przystanek przy posagu Grzegorza z Ninu i parkowej zieleni domyka polnocny koniec spaceru | <a href=\"https://visitsplit.com/clients/1/downloads/67ck1bhalu62pnp.pdf?lang=en\" target=\"_blank\" rel=\"noopener\">Oficjalna mapa bram i glownych punktow (PDF)</a> | <a href=\"https://www.google.com/maps/dir/?api=1&origin=Bronze%20Gate%20Split&destination=Narodni%20trg%20Split&waypoints=Peristyle%20Split%7CGolden%20Gate%20Split&travelmode=walking\" target=\"_blank\" rel=\"noopener\">🗺️ Palac: Brama Brazowa → Perystyl → Zlota Brama → Pjaca</a>"},
{t:"18:45–19:45",d:"Przez <b>Pjace</b> do Kantun Paulina (zachodnia czesc centrum) — cevapi w lepinji jako prosty miesny posilek. Po kolacji dalej ku Prokurative, bez obowiazkowego powrotu przez caly palac",r:{n:"Kantun Paulina",d:"Cevapi w lepinji z cebula | Matosica 1 | 5–10 EUR/os | 4.6 | 4503 ocen | mala kolejka"}},
{t:"19:45–21:00",d:"<b>Prokurative → zachodnia Riva</b>, kawa lub siedzenie nad woda. Przy hotelu na wschodzie powrot Riva naturalnie zamyka petle; przy Varosu zakoncz spacer tutaj. <b>Drobny wybor na wieczor:</b> Perystyl po zmroku jako swiadomy dodatkowy powrot po kolacji (ok. 15–25 min samego chodzenia) — do tego wariantu pasuje Marvlvs (Papaliceva); NOOR do wieczoru kolo Pjacy. Nie dokladaj obu barow i obu zakonczen naraz"}],
w:"Deszcz: podziemia 60–90 min, jesli otwarte; przy poznym przyjezdzie wystarczy kolacja. Odpusc polnocna petle, bar i nocne zdjecia. Wnetrza maja wlasny dzien, wiec opoznienie autobusu nie rozbija calego Splitu.",
sp:"Transfer ten sam, starowka skrocona do Rivy i Perystylu (godziny przejazdu wg kupionego biletu). 08:00–09:00 sniadanie, wymeldowanie, kontrola dokumentow/bagazu | 09:00–10:00 dworzec w Zadarze z zapasem | 10:00–13:30 podroz do Splitu z buforem na ruch | 13:30–14:30 walizka i lunch blisko hotelu (Bakra, jesli pasuje do dojscia od portu) | 14:30–18:00 zameldowanie, prysznic, dlugi odpoczynek | 18:00–19:00 Riva, kawa nad woda | 19:00–20:00 kolacja po stronie hotelu: Kantun Paulina (zachodnie centrum) lub Bakra (Lucac/Bacvice) | 20:00–21:00 krotkie wejscie na Perystyl, bez polnocnej petli i platnych wnetrz | 21:00–21:30 powrot i odpoczynek.",
note:"Godziny orientacyjne, daty robocze — brak rezerwacji. Nie nosicie walizki podczas zwiedzania. Transfer bez przystankow: Trogir i Sibenik wymagaja osobnych odcinkow transportu i przechowania walizki — nie sa czescia tego przejazdu, kierowca autobusu liniowego nie czeka na zwiedzanie. Wt. 22.06 to swieto w Chorwacji — autobusy moga jechac wg rozkladu swiatecznego."},

{id:6,c:"split",dt:"Sroda, 23 czerwca",t:"Wyspa Hvar albo Brac",s:"Hvar: Pjaca, Arsenal, twierdza Fortica i Pakleni otoci — albo Bol i Zlatni Rat",i:[
{t:"07:00–07:45",d:"Sniadanie przy noclegu; woda, krem, nakrycie glowy, stroj i recznik. Walizka zostaje w hotelu. <b>Trasa:</b> port w Splicie → katamaran → Hvar, nabrzeze → plac sw. Szczepana i katedra → Arsenal z teatrem → twierdza Fortica (Spanjola) → obiad → plaza lub lodka na Pakleni otoci → katamaran powrotny | spacer ok. <b>4–6 km</b>, w tym podejscie na twierdze 20–30 min po schodach i sciezce w sosnach | umiarkowany w upale | godziny dla porannego kursu — dopasuj do biletu"},
{t:"07:45–08:15",d:"Dojscie na wlasciwe nabrzeze z biletu (katamarany odplywaja z roznych czesci portu) — zapas 20–30 min"},
{t:"08:15–09:30",d:"Katamaran do Hvaru (Krilo / Kapetan Luka, komercyjne kursy TP Line lub Jadrolinija; 50 min – 1 h 20 min, ok. 20–25 EUR/os/strona). Siadz na zewnatrz, jesli jest poklad — widoki na Brac i Solte | <a href=\"https://www.krilo.hr/hr/schedule\" target=\"_blank\" rel=\"noopener\">Krilo — rozklad</a> | <a href=\"https://www.jadrolinija.hr/hr/putovanje/split_-_bol_brac_-_jelsa_hvar\" target=\"_blank\" rel=\"noopener\">Jadrolinija</a> | <a href=\"https://www.tp-line.hr/\" target=\"_blank\" rel=\"noopener\">TP Line</a> | <a href=\"https://www.allferriescroatia.com/en/route/split--hvar-center-hvar--ferry-catamaran-ship-timetable-prices\" target=\"_blank\" rel=\"noopener\">Zbiorczy rozklad Split–Hvar</a> | <a href=\"https://www.allferriescroatia.com/en/route/split--bol-brac--ferry-catamaran-ship-timetable-prices\" target=\"_blank\" rel=\"noopener\">Zbiorczy rozklad Split–Bol</a>"},
{t:"09:30–10:30",d:"<b>Plac sw. Szczepana</b> (Pjaca) — jeden z najwiekszych placow w Dalmacji, katedra z zewnatrz i <b>Arsenal</b> z teatrem z 1612 r. (jeden z najstarszych teatrow publicznych w Europie). Krotka kawa przy placu, zanim zrobi sie tloczno | <a href=\"https://www.google.com/maps/search/?api=1&query=Trg%20Svetog%20Stjepana%20Hvar\" target=\"_blank\" rel=\"noopener\">📍 Plac sw. Szczepana</a> | <a href=\"https://www.visithvar.hr/\" target=\"_blank\" rel=\"noopener\">Informacja turystyczna Hvaru</a>"},
{t:"10:30–12:00",d:"<b>Fortica (Spanjola)</b> — podejscie uliczkami nad placem i sciezka przez park. Z murow widac port, czerwone dachy i Pakleni otoci (najlepszy kadr przed poludniem). Bilet i godziny sprawdz na miejscu. W duzym upale zostan przy samej panoramie ze sciezki | <a href=\"https://www.google.com/maps/search/?api=1&query=Fortica%20Spanjola%20Hvar\" target=\"_blank\" rel=\"noopener\">📍 Twierdza Fortica</a>"},
{t:"12:00–13:30",d:"Zejscie i obiad w uliczkach nad placem albo przy nabrzezu. <b>Hvar jest drozszy niz Split</b> — sprawdz cene dania przed zamowieniem; pizza lub danie dnia mieszcza sie w budzecie latwiej niz ryba na wage"},
{t:"13:30–16:30",d:"Wybierz <b>jedno</b>: 🏝️ <b>lodka (taxi boat) na Pakleni otoci</b> z nabrzeza — Palmizana lub Jerolim, ok. 15–20 min plyniecia; kapiel w zatoce i powrot lodka z zapasem przed katamaranem (ustal godzine ostatniej lodzi powrotnej przed wyplynieciem) | <a href=\"https://www.google.com/maps/search/?api=1&query=Palmizana%20Pakleni%20otoci\" target=\"_blank\" rel=\"noopener\">📍 Pakleni otoci — Palmizana</a> | albo 🏖️ <b>plaza w miescie</b> — spacer nabrzezem na zachod (kapieliska przy promenadzie) lub na wschod w strone Pokonji Dol; bez lodki"},
{t:"16:30–17:00",d:"Powrot na nabrzeze katamaranu, z zapasem"},
{t:"17:00–18:30",d:"Katamaran do Splitu (godzina wedlug biletu) — ostatnia rzecz, na ktora mozna sie spoznic"},
{t:"18:30–19:30",d:"Prysznic i odpoczynek"},
{t:"19:30–20:30",d:"Kolacja przy hotelu: <b>Bakra</b> przy Lucacu/Bacvicach albo <b>Kantun Paulina</b> w zachodnim centrum. Sug ma sens tego wieczoru po wczesniejszej rezerwacji"}],
w:"Silny wiatr lub odwolane katamarany: zostan w Splicie — podziemia lub katedra, obiad, odpoczynek; wykonane wnetrze wykresl z dnia 24.06. Dni 23.06 i 24.06 mozna zamienic, jesli bilety na katamaran na to pozwalaja. Przy zmeczeniu odpusc najpierw lodke na Pakleni otoci (Hvar) albo spacer po Bolu; zachowaj zapas na powrotny katamaran.",
sp:"Zamiast wyspy — plaza w Splicie, ok. 3–5 km z powrotem, latwo (<a href=\"https://www.google.com/maps/dir/?api=1&origin=Riva%20Split&destination=Bakra%20Split&waypoints=Bacvice%20Beach%20Split%7COvcice%20Beach%20Split&travelmode=walking\" target=\"_blank\" rel=\"noopener\">trasa Riva → Bacvice → Ovcice → Bakra</a>): 09:00–10:00 sniadanie i spokojne wyjscie | 10:00–12:00 Bacvice → Ovcice, jedno miejsce na kapiel | 12:00–13:00 Bakra przy powrocie przez Lucac (pizza lub cevapi) | 13:00–17:00 hotel, prysznic, odpoczynek | 17:00–18:00 krotki spacer po Rivie i kawa | 18:00–19:00 kolacja: Kantun Paulina albo Sug po sprawdzeniu stolika | 19:00–20:30 spokojny powrot, sprawdzenie godzin jutrzejszych wnetrz i komunikatow o Marjanie",
alt:"ALT: <b>Bol na Bracu i Zlatni Rat</b> (wybierz, jesli marzy Ci sie wlasnie Zlatni Rat). Trasa: Split → katamaran Krilo → Bol, port → promenada z sosnami → Zlatni Rat → obiad → port → Split | port → Zlatni Rat ok. 2 km / 25–30 min plaska promenada w cieniu sosen, w obie strony 4–5 km, latwy | 08:00–09:00 sniadanie i dojscie na nabrzeze | 09:30–10:30 katamaran do Bolu (Krilo sezonowo, w 2024 od ok. 8.06, np. 09:30; ok. 1 h, ok. 25 EUR/os/strona; najtaniej: prom Jadrolinija do Supetaru ok. 50 min + autobus ok. 1 h) | 10:30–11:00 promenada wzdluz morza na zachod | 11:00–14:00 <b>Zlatni Rat</b> — zwirowy cypel zmieniajacy ksztalt z wiatrem i pradem; kapiel, cien pod sosnami za plaza; lezaki i parasole platne, przy dwoch osobach jeden parasol wystarczy | 14:00–15:00 obiad przy plazy lub w drodze do portu | 15:00–16:00 port i uliczki Bolu, lody | 16:00–17:30 katamaran do Splitu (wg biletu; przez Supetar doliczcie autobus) | 18:00–20:30 odpoczynek i kolacja przy hotelu | Wiatr: po poludniu przy Zlatnym Racie bywa wietrznie — rano spokojniej | <a href=\"https://www.google.com/maps/search/?api=1&query=Zlatni%20Rat%20Bol\" target=\"_blank\" rel=\"noopener\">📍 Zlatni Rat</a> | <a href=\"https://www.google.com/maps/search/?api=1&query=Bol%20harbour%20Brac\" target=\"_blank\" rel=\"noopener\">📍 Port w Bolu</a> | <a href=\"https://www.bol.hr/\" target=\"_blank\" rel=\"noopener\">Informacja turystyczna Bolu</a>",
note:"<b>Katamarany — najwazniejsza pulapka:</b> tanie linie panstwowe nie nadaja sie na jednodniowke — Jadrolinija 9603 (Split–Bol–Jelsa, ok. 6 EUR) i TP Line 9604 (Split–Hvar, ok. 10 EUR) plyna ze Splitu po poludniu, a z wysp wczesnie rano. Kupuj komercyjne katamarany rano tam, po poludniu z powrotem — <b>bilety tam i z powrotem na konkretne kursy</b> (w czerwcu poranne potrafia sie wyprzedac). Zapisz nabrzeze odplyniecia w Splicie. Przy Bolu sprawdz, czy Krilo kursuje juz w Twoim terminie (poczatek czerwca moze wypasc przed startem linii sezonowej). Budzet 2 os.: ok. <b>80–100 EUR za katamarany w obie strony</b> + jedzenie, twierdza, ewentualna lodka. Dane 2024–2026 (odczyt 18.10.2026), nie rozklad na 2027 — sprawdz ok. marca–kwietnia 2027. Rekomendacja: <b>Hvar</b> — plaz bedzie pod dostatkiem w Breli. To jedyny dzien na duzej wyspie w podrozy; Omis z Cetina przeniesiony do Breli (dzien 29.06), Krka i Zrmanja wypadly. | <a href=\"https://www.krilo.hr/hr/schedule\" target=\"_blank\" rel=\"noopener\">Krilo — rozklad</a> | <a href=\"https://www.jadrolinija.hr/hr/putovanje/split_-_bol_brac_-_jelsa_hvar\" target=\"_blank\" rel=\"noopener\">Jadrolinija</a> | <a href=\"https://www.tp-line.hr/\" target=\"_blank\" rel=\"noopener\">TP Line</a> | <a href=\"https://www.allferriescroatia.com/en/route/split--hvar-center-hvar--ferry-catamaran-ship-timetable-prices\" target=\"_blank\" rel=\"noopener\">Zbiorczy rozklad Split–Hvar</a> | <a href=\"https://www.allferriescroatia.com/en/route/split--bol-brac--ferry-catamaran-ship-timetable-prices\" target=\"_blank\" rel=\"noopener\">Zbiorczy rozklad Split–Bol</a>"},

{id:7,c:"split",dt:"Czwartek, 24 czerwca",t:"Palac rano, zachodnia starowka i Vidilica po odpoczynku",s:"Katedra, Jowisz, podziemia, Pjaca i Prokurative, sjesta, panorama z Vidilicy | ok. 5–7 km + hotel (dalszy Marjan wiecej) | umiarkowany — glownie schody na punkt widokowy",i:[
{t:"08:00–08:45",d:"Sniadanie w hotelu lub piekarni przy dojsciu. Przy starcie od wschodu krotko <b>Pazar</b>, potem wejscie Srebrna Brama; przy starcie od polnocy Zlota Brama — nie obchodz palacu dookola wylacznie dla targu | <a href=\"https://www.google.com/maps/dir/?api=1&origin=Silver%20Gate%20Split&destination=Diocletian%20Palace%20Cellars%20Split&waypoints=Cathedral%20of%20Saint%20Domnius%20Split%7CTemple%20of%20Jupiter%20Split&travelmode=walking\" target=\"_blank\" rel=\"noopener\">🗺️ Zespol palacowy: Srebrna Brama → katedra → Jowisz → podziemia</a>"},
{t:"09:00–10:15",d:"<b>Katedra sw. Dujma</b> i wybrany element zestawu — drewniane drzwi, zderzenie antycznej bryly z pozniejszym wnetrzem. Dzwonnica opcjonalna dla chetnych na dodatkowe schody | pakiet i otwarcie wg aktualnej kasy, nabozenstwa maja pierwszenstwo | <a href=\"https://visitsplit.com/en/527/cathedral-of-saint-domnius\" target=\"_blank\" rel=\"noopener\">Katedra — oficjalny opis</a>"},
{t:"10:15–10:45",d:"<b>Swiatynia Jowisza / baptysterium</b> tuz obok Perystylu, jesli obejmuje ja bilet — kasetonowe sklepienie, male wnetrze bez planowania odleglego muzeum | <a href=\"https://visitsplit.com/en/526/temple-of-jupiter/Split\" target=\"_blank\" rel=\"noopener\">Oficjalny opis</a>"},
{t:"10:45–11:45",d:"<b>Vestibul</b> → zejscie do <b>podziemi palacu</b> → wyjscie na Rive. 45–60 min w platnych salach, jesli interesuje Was konstrukcja palacu (centralne przejscie nie zastepuje ekspozycji); krotkie cofniecie ku schodom normalne. Jesli podziemia byly w deszczowy dzien — czas na kawe | <a href=\"https://mgs.hr/hr/posjetite-nas/muzejske-lokacije/podrumi-dioklecijanove-palace/\" target=\"_blank\" rel=\"noopener\">Zarzadca: Podrumi Dioklecijanove palace</a>"},
{t:"11:45–12:15",d:"Riva na zachod → <b>Vocni trg → Pjaca</b>. Przy Bramie Zelaznej zegar z 24-godzinna tarcza — krotki detal po drodze | <a href=\"https://visitsplit.com/clients/1/downloads/67ck1bhalu62pnp.pdf?lang=en\" target=\"_blank\" rel=\"noopener\">Oficjalna mapa i opisy</a> | <a href=\"https://www.google.com/maps/dir/?api=1&origin=Vocni%20trg%20Split&destination=Konoba%20Varos%20Split&waypoints=Narodni%20trg%20Split%7CProkurative%20Split&travelmode=walking\" target=\"_blank\" rel=\"noopener\">🗺️ Na zachod: Vocni trg → Pjaca → Prokurative → Varos</a>"},
{t:"12:15–13:15",d:"Lunch blisko Pjacy — cielecina, watrobka lub makaron z aktualnej karty. Przy kolejce lub braku dania dalej na zachod: Kantun Paulina (cevapi) albo Konoba Varos (marenda, jesli nadal podawana). Nie poswiecaj sjesty na czekanie",r:{n:"Villa Spiza",d:"Cielecina / watrobka cieleca z dnia | makaron | Petra Kruzica 3 | 20–40 EUR/os | 4.7 | 2247 ocen | kolejki mozliwe | zapas: Kantun Paulina, Konoba Varos"}},
{t:"13:15–13:45",d:"Krotko <b>Marmontova → Prokurative</b>, potem hotel — jedyny zachodni odcinek starowki, naturalnie prowadzacy ku Varosowi"},
{t:"13:45–17:00",d:"Odpoczynek w noclegu"},
{t:"17:00–17:45",d:"Z dolnego <b>Varosu ulica Senjska i schodami na Vidilice</b>. Przy duzym upale wyjdz pozniej i skroc pobyt, zostawiajac swiatlo na zejscie | <a href=\"https://www.google.com/maps/search/?api=1&query=Prva%20Vidilica%20Marjan%20Split\" target=\"_blank\" rel=\"noopener\">📍 Vidilica</a>"},
{t:"17:45–18:30",d:"Panorama starowki, dzwonnicy i portu — publiczny widok nie wymaga zakupu w kawiarni. Dalszy spacer w las tylko przy potwierdzonym dostepie i zapasie czasu; <b>Telegrin nie jest celem podstawowym</b>. Widok skierowany ku miastu — panorama w poznym swietle, nie zachod slonca za palacem"},
{t:"18:30–19:15",d:"Powrot do dolnego Varosu"},
{t:"19:15–20:15",d:"Kolacja po tej stronie miasta — karta wieczorna; nie zakladaj ceny i oferty marendy z poludnia. Albo cevapi w Kantun Paulina. Przy hotelu na wschodzie: kolacja po powrocie w okolicy Bakry",r:{n:"Konoba Varos",d:"aktualna karta wieczorna (marenda tylko w poludnie) | ban Mladenova 7 | 20–40 EUR/os | 4.2 | albo Kantun Paulina"}},
{t:"20:15–21:00",d:"Zakup prowiantu, pakowanie, sprawdzenie dworca i jutrzejszego przystanku w Breli. Opcjonalnie kilka minut zachodniej Rivy, jesli lezy na drodze do hotelu. Jutro zmiana bazy!"}],
w:"Deszcz: katedra i podziemia wg otwarcia, lunch, sjesta; po poludniu kawiarnia lub spacer przy poprawie pogody. Odpusc najpierw: dzwonnice, baptysterium, platne podziemia, dalszy Marjan. Katedra i Vidilica zostaja dwoma glownymi celami, o ile pogoda i dostep pozwola.",
sp:"Ok. 3–5 km + hotel, podejscie po schodach. 09:00–10:00 sniadanie przy noclegu i dojscie najblizsza brama | 10:00–11:00 Perystyl i wnetrze katedry (bez dzwonnicy i kolejnych biletow) | 11:00–12:00 spokojnie przez Vocni trg do Pjacy, kawa po drodze | 12:00–13:00 lunch: Villa Spiza, przy kolejce Kantun Paulina dalej na zachod | 13:00–17:00 hotel i odpoczynek | 17:00–18:30 Varos → Senjska → Vidilica, panorama i zejscie ta sama strona, bez dalszego Marjanu | 18:30–19:30 kolacja w dolnym Varosu lub przy hotelu (karta wieczorna) | 19:30–20:30 pakowanie, prowiant, kontrola jutrzejszego autobusu i przystanku w Breli.",
alt:"Kolejnosc: najpierw skupione wnetrza palacu, potem zachodnia starowka, a <b>Marjan jako jedno pozniejsze wyjscie z Varosu</b> po sjescie — bez schodzenia ze wzgorza do katedry i ponownego przechodzenia przez miasto. Dwa kadry bez dojazdu: rano bryla katedry z Perystylu, pozniej cale miasto z Vidilicy.",
note:"<b>Dostep do Marjanu:</b> sprawdz biezace komunikaty <a href=\"https://www.marjan-parksuma.hr/\" target=\"_blank\" rel=\"noopener\">zarzadcy Park-suma Marjan</a> i oznakowanie na miejscu; stare artykuly o zamknieciach/remontach nie przesadzaja stanu w 2027, nie obchodz barier. Jesli Vidilica niedostepna — zakoncz na dolnym Varosu i Rivie | <a href=\"https://visitsplit.com/index.php/hr/506/marjan\" target=\"_blank\" rel=\"noopener\">Miejska informacja o Marjanie</a>. Godziny orientacyjne, brak rezerwacji."},

// ===== BRELA =====
{id:8,c:"brela",dt:"Piatek, 25 czerwca",t:"Split → Brela — pierwsza plaza",s:"Transfer autobusem, Soline wieczorem",i:[
{t:"08:00–09:00",d:"Sniadanie, pakowanie, kontrola biletu i przystanku wysiadki. Zapisz telefon hotelu lub taksowki w Breli"},
{t:"09:00–10:30",d:"Wymeldowanie, dojscie na dworzec autobusowy przy porcie w Splicie, zapas czasu przed kursem. Przewoznicy: <a href=\"https://www.arriva.com.hr/\" target=\"_blank\" rel=\"noopener\">Arriva</a> · <a href=\"https://www.promet-makarska.hr/\" target=\"_blank\" rel=\"noopener\">Promet Makarska</a> · <a href=\"https://www.flixbus.pl/\" target=\"_blank\" rel=\"noopener\">FlixBus</a> (okolo 60 kursow dziennie, tez Nomago)"},
{t:"10:30–11:30",d:"Autobus wzdluz wybrzeza przez Omis (50–60 min). Usiadz po <b>prawej stronie</b> — widok na morze i wyspy"},
{t:"11:30–12:15",d:"Przystanek na D8 → taksowka lub odbior → hotel. Zostaw walizke, jesli pokoj nie jest gotowy. <a href=\"https://brela.hr/en/arrival\" target=\"_blank\" rel=\"noopener\">Taksowki z listy gminy</a>"},
{t:"12:15–13:30",d:"Lunch przy porcie: Feral (otwarty od 11:00, w poludnie latwiej o stolik) albo pizza w Lungo Mare",r:{n:"Konoba Feral",d:"Kalmary / osmiornica z grilla | Obala Kneza Domagoja 30 | port Breli | otwarte od 11:00 | 20–45 EUR/os | 4.7 | 1873 ocen | alternatywa: pizza w Lungo Mare"}},
{t:"13:30–17:00",d:"Zameldowanie i odpoczynek. Zakupy na sniadania i plaze w Konzum albo piekarni przy porcie — przy jednym krotkim wyjsciu"},
{t:"17:00–18:30",d:"<b>Soline</b> — pierwsza kapiel tuz na zachod od portu. Widok na Biokovo nad zatoka. <a href=\"https://www.google.com/maps/search/?api=1&query=Soline%20Beach%20Brela\" target=\"_blank\" rel=\"noopener\">📍 Soline</a>"},
{t:"18:30–19:30",d:"Kolacja w porcie, bez rezerwacji. Miej gotowke",r:{n:"Lungo Mare albo Nautica",d:"pizza | port Breli | bez rezerwacji | gotowka"}},
{t:"19:30–20:30",d:"Krotki spacer promenada w strone Punta Rata (10–15 min) i powrot — jutro tam wracacie na caly poranek. 📷 Maly dodatek: port z lodziami i Biokovem w tle przy zachodzie — 10 minut po kolacji. <a href=\"https://www.google.com/maps/search/?api=1&query=Brela%20harbour%20Obala%20kneza%20Domagoja\" target=\"_blank\" rel=\"noopener\">📍 Port Brela</a>"}],
w:"Przejazd bez zmian, potem posilek i odpoczynek. Odpuszczamy zwiedzanie z walizka i przejscie z przystanku pieszo z bagazem.",
sp:"08:00–09:00 sniadanie, pakowanie, kontakt do hotelu/taksowki | 09:00–12:15 dworzec, autobus i taksowka z walizka do hotelu (godziny wg biletu) | 12:15–13:30 lunch najblizej hotelu | 13:30–18:00 zameldowanie, prysznic i dlugi odpoczynek, plaza nieobowiazkowa | 18:00–19:00 kolacja w porcie (Lungo Mare, Nautica) | 19:00–20:30 krotko port i powrot",
note:"<b>Trasa:</b> nocleg w Splicie → dworzec przy porcie → przystanek w Breli na D8 → taxi lub odbior do hotelu → Soline → port. Jazda 50–60 min, od drzwi do drzwi 2,5–3,5 h, na miejscu 2–4 km spacerem · latwo. | <b>Przystanki Breli sa na D8, ok. 100–130 m nad morzem</b> — zejscie do portu 8–15 min stromymi uliczkami, z walizka 20 kg wez taksowke (krotki kurs po Breli ok. 10–15 EUR) albo popros hotel o odbior. Wysiadka: „Brela Soline / Magistrala” dla portu, Soline i hoteli Berulia/Soline; glowny „Brela” (przy supermarkecie Ribola) dla Punta Rata, Maestrala i Podrace. Nie kazdy kurs staje na obu — sprawdz przystanek na bilecie i powiedz kierowcy, gdzie wysiadasz. <a href=\"https://www.google.com/maps/search/?api=1&query=Ribola%20Brela\" target=\"_blank\" rel=\"noopener\">📍 Przystanek „Brela” (Ribola, D8)</a> · <a href=\"https://brela.hr/en/arrival\" target=\"_blank\" rel=\"noopener\">Taksowki z listy gminy</a> | Godziny orientacyjne, brak rezerwacji."},

{id:9,c:"brela",dt:"Sobota, 26 czerwca",t:"Punta Rata, Kamen Brela i Podrace",s:"Promenada na polnocny zachod: port → Soline → Punta Rata → Kamen Brela → Podrace → Scit | ok. 5–6 km w obie strony, plasko, w cieniu sosen | latwo",i:[
{t:"08:00–09:00",d:"Sniadanie. Plecak: woda, krem, recznik, buty do wody. <b>Gotowka na lunch</b>. Trasa: hotel → port → Soline → plaza Maestral → Punta Rata → Kamen Brela → Podrace → Scit (najdalszy punkt) → powrot ta sama promenada | <a href=\"https://brela.hr/en/beaches\" target=\"_blank\" rel=\"noopener\">Plaze — TZ Brela</a> | <a href=\"https://brela.hr/en/active-holidays/lungo-mare-the-path-of-vitality\" target=\"_blank\" rel=\"noopener\">Lungomare</a>"},
{t:"09:00–09:30",d:"Promenada przez Soline na <a href=\"https://www.google.com/maps/search/?api=1&query=Punta%20Rata%20Brela\" target=\"_blank\" rel=\"noopener\">Punta Rata</a> (15–20 min od portu)"},
{t:"09:30–11:30",d:"<b>Punta Rata</b> — kapiel, zanim zrobi sie tloczno. Cien pod sosnami za plaza jest darmowy | lezaki Maestral Beach Club ok. 35 EUR za dwa na dzien"},
{t:"11:30–12:00",d:"Obejdz cypel na polnocny zachod do <a href=\"https://www.google.com/maps/search/?api=1&query=Kamen%20Brela\" target=\"_blank\" rel=\"noopener\">Kamen Brela</a> — zdjecie skaly z sosna z brzegu, nie trzeba na nia wchodzic | najlepiej wyglada przed poludniem, zanim zbierze sie tlum"},
{t:"12:00–12:30",d:"<a href=\"https://www.google.com/maps/search/?api=1&query=Podrace%20Beach%20Brela\" target=\"_blank\" rel=\"noopener\">Podrace</a> — krotka kapiel lub tylko przejscie"},
{t:"12:30–14:00",d:"Lunch w Scit — grill z ziemniakami przy samej wodzie, w cieniu sosen | <a href=\"https://www.google.com/maps/search/?api=1&query=LA%20Bomba%20%C5%A0%C4%87it%2059%20Brela\" target=\"_blank\" rel=\"noopener\">mapa: LA Bomba, Scit 59</a>",r:{n:"LA Bomba",d:"Scit 59 | grill z ziemniakami | przy wodzie, w cieniu sosen | TYLKO GOTOWKA"}},
{t:"14:00–15:30",d:"Przeczekaj upal w cieniu: kapiel w Scit / Podrace, drzemka pod sosna. Bez marszu w najgoretszych godzinach"},
{t:"15:30–16:15",d:"Powrot promenada do hotelu (wiekszosc trasy w cieniu)"},
{t:"16:15–18:30",d:"Prysznic i odpoczynek"},
{t:"19:00–20:30",d:"Kolacja w Feral",r:{n:"Feral",d:"mieso i njoki z wolowina mieszcza sie w budzecie | zarezerwuj kilka dni wczesniej albo przyjdz przed 19:00"}}],
w:"Deszcz / burza: przenies pelny spacer na dzien 28.06 lub 13. Najpierw skresl Podrace i Scit, potem Kamen — zostaw Punta Rate.",
sp:"Punta Rata wystarczy; Kamen i Podrace mozna zobaczyc w dniu 28.06 albo 13. 09:00–10:00 sniadanie bez pospiechu | 10:00–12:30 Punta Rata: kapiel i cien | 12:30–13:30 lunch w porcie (Lungo Mare, Gusti) albo najblizej hotelu | 13:30–17:00 prysznic i odpoczynek | 17:00–18:30 kawa przy promenadzie, krotki spacer do Kamen Brela przy lagodnym swietle | 19:00–20:30 kolacja w Feral albo pizza w porcie.",
note:"LA Bomba — tylko gotowka. Feral — rezerwacja kilka dni wczesniej albo przyjscie przed 19:00. Godziny orientacyjne, brak rezerwacji; wybierz plan glowny albo spokojny."},

{id:10,c:"brela",dt:"Niedziela, 27 czerwca",t:"Mostar z czasem na miasto",s:"Wycieczka z odbiorem w Breli — ok. 4 h w Mostarze, 10–12 h z granica",i:[
{t:"07:00–08:00",d:"Sniadanie i odbior (godzina wedlug oferty). <b>Fizyczny paszport lub dowod</b>, woda, nakrycie glowy, przekaska, buty z dobra podeszwa"},
{t:"08:00–11:00",d:"Przejazd z granica — to zapas, nie obietnica trzech godzin"},
{t:"11:00–11:40",d:"Okolice meczetu <b>Koski Mehmed-paszy</b> — dziedziniec, wnetrze lub minaret wedlug dostepnosci, najwyzej jeden dodatkowy punkt | <a href=\"https://www.google.com/maps/search/?api=1&query=Koski%20Mehmed%20Pasha%20Mosque%20Mostar\" target=\"_blank\" rel=\"noopener\">Mapa</a>"},
{t:"11:40–12:30",d:"<b>Kujundziluk → Stari Most</b> — bazarowa uliczka do mostu, widok z jego szczytu i przejscie na zachodni brzeg. Most i starowka sa na <a href=\"https://whc.unesco.org/en/list/946\" target=\"_blank\" rel=\"noopener\">liscie UNESCO</a> | <a href=\"https://www.google.com/maps/search/?api=1&query=Stari%20Most%20Mostar\" target=\"_blank\" rel=\"noopener\">Stari Most (mapa)</a>"},
{t:"12:30–13:30",d:"Obiad po zachodniej stronie: <b>Tima–Irma</b> (cevapi, pljeskavica) albo <b>Sadrvan</b> (tradycyjny polmisek). Ceny w <b>KM</b>",r:{n:"Tima–Irma",d:"Cevapi / pljeskavica | ceny w KM | ALT: Sadrvan — tradycyjny polmisek"}},
{t:"13:30–14:15",d:"<b>Kriva Cuprija</b> i kawa po bosniacku | <a href=\"https://www.google.com/maps/search/?api=1&query=Kriva%20Cuprija%20Mostar\" target=\"_blank\" rel=\"noopener\">Mapa</a>"},
{t:"14:15–15:00",d:"Ostatni kadr na Neretwe i powrot na zbiorke z zapasem 20–30 min"},
{t:"15:00–19:00",d:"Powrot z zapasem na granice (przy wariancie z Kravicami postoj na kapiel po drodze)"},
{t:"19:00–20:30",d:"Prosta kolacja w porcie: <b>Hrast</b> albo <b>Lungo Mare</b>, bez rezerwacji"}],
w:"Deszcz / upal: w porozumieniu z operatorem przenies Mostar na 28.06 (poniedzialek). Najpierw odpusc minaret i wnetrza — zostaw starowke, most i spokojny obiad.",
sp:"Bez Mostaru, ok. 1–3 km: 09:00 sniadanie | 10:00–12:30 Soline albo Punta Rata | 12:30 lunch w porcie | 13:30–17:00 odpoczynek | 17:00–18:30 kawa i spacer promenada | 19:00–20:30 kolacja w porcie.",
alt:"Oferty z odbiorem na Riwierze (odczyt 18.10.2026): <b>GetYourGuide</b> — mala grupa Mostar i Kravice z Makarskiej / Baski Vody, ok. 65–70 EUR/os., 11 h, odbior dostepny (wersja z Baski Vody na stronie Breli) | <b>Prywatna grupa do 8 os.</b> — Mostar i Kravice, ok. 300 EUR za grupe + bilet do Kravicy ok. 10 EUR/os., 8 h, Brela na liscie odbiorow | <b>Simply Adria</b> — Mostar i Blagaj, ok. 70 EUR/os., 9 h, odbior w cenie. Dni kursowania w czerwcu nieznane (kalendarze 2027 zima/wiosna). Wybierz program z ok. 3,5–4 h w samym Mostarze; jesli Kravice skracaja miasto do 2 h, szukaj innej oferty | <a href=\"https://www.getyourguide.com/brela-l205100/\" target=\"_blank\" rel=\"noopener\">GetYourGuide — Brela</a> | <a href=\"https://www.getyourguide.com/makarska-riviera-l195112/\" target=\"_blank\" rel=\"noopener\">GetYourGuide — Riwiera Makarska</a>",
note:"Osobny dzien bez walizki, w niedziele — nie w sobote (wymiana turnusow, tloczniej na D8 i granicy). Przy rezerwacji sprawdz, czy oferta kursuje w niedziele. Trasa: meczet Koski Mehmed-paszy → Kujundziluk → Stari Most → obiad → Kriva Cuprija → zbiorka, ok. 2–4 km, schody, tlum, sliski bruk. <b>Punkt zbiorki ustal przed odejsciem od busa.</b> | <b>Dokumenty:</b> paszport lub dowod osobisty — fizyczny, wazny min. 3 miesiace po wyjezdzie; sprawdz zasady na 2027 (<a href=\"https://www.gov.pl/web/bosniaihercegowina/informacje-dla-podrozujacych2\" target=\"_blank\" rel=\"noopener\">Ambasada RP — wjazd</a>) | <b>Pieniadze i telefon:</b> placi sie w markach (KM); euro zwykle przyjmuja, ale reszte wydaja w KM — wez drobne euro i karte. EKUZ w BiH nie dziala — potrzebne prywatne ubezpieczenie podrozne. Roaming UE nie obowiazuje — pakiet u operatora albo Wi-Fi i mapa offline."},

{id:11,c:"brela",dt:"Poniedzialek, 28 czerwca",t:"Plaza, odpoczynek i wieczorem Baska Voda",s:"Lekki dzien po Mostarze — rano plaza, wieczorem promenada do Baski Vody (ok. 5 km w obie strony, latwo)",i:[
{t:"09:00–10:00",d:"Spokojne sniadanie po wczorajszym dniu"},
{t:"10:00–13:00",d:"Najblizsza plaza: <b>Soline</b> albo <b>Punta Rata</b>; jesli w dniu 26.06 odpusciliscie Kamen i Podrace — teraz"},
{t:"13:00–14:00",d:"Lekki lunch w porcie: kanapka w Gusti albo pizza w Lungo Mare",r:{n:"Gusti / Lungo Mare",d:"Port Brela | kanapka (Gusti) albo pizza (Lungo Mare)"}},
{t:"14:00–17:30",d:"Odpoczynek w hotelu. Zadzwon do <b>Bracery</b> i zarezerwuj stolik na wieczor"},
{t:"17:30–18:15",d:"Promenada na poludniowy wschod: port Brela → Loznica (hotel Berulia) → granica gmin → Ikovac → <b>Podluka</b> | <a href=\"https://brela.hr/en/active-holidays/lungo-mare-the-path-of-vitality\" target=\"_blank\" rel=\"noopener\">Lungomare — TZ Brela</a>"},
{t:"18:15–19:45",d:"Kolacja w <b>Bracera</b> (Podluka) | <a href=\"https://www.google.com/maps/search/?api=1&query=Restaurant%20Bracera%20Podluka%2017%20Ba%C5%A1ka%20Voda\" target=\"_blank\" rel=\"noopener\">📍 Bracera, Podluka 17</a>",r:{n:"Bracera",d:"Podluka 17, Baska Voda | mixed grill, kotlety jagniece, rumsztyk | rezerwacja telefonicznie po poludniu | ALT w centrum Baski: Palac (cevapi, duszona wolowina)"}},
{t:"19:45–20:30",d:"Jeszcze 10 minut do <b>Baski Vody</b>: port, plaza Nikolina, kosciol sw. Mikolaja i wieczorna promenada | <a href=\"https://www.google.com/maps/search/?api=1&query=Nikolina%20Beach%20Baska%20Voda\" target=\"_blank\" rel=\"noopener\">📍 Nikolina</a> | 📷 port w Basce Vodzie z Biokovem w zachodzacym swietle"},
{t:"20:30–21:15",d:"Powrot promenada (30–35 min) albo taksowka (orientacyjnie 15–20 €). Po zmroku trzymaj sie oswietlonych odcinkow i wez latarke w telefonie"}],
w:"Dzien odpoczynku; spacer tylko w przerwie opadow. Pierwsza do skreslenia jest Baska Voda — kolacje zjedzcie w Breli.",
sp:"Bez Baski Vody, ok. 1–2 km: 09:00–10:00 sniadanie | 10:00–12:30 Soline | 12:30–13:30 lunch w porcie | 13:30–17:30 odpoczynek | 17:30–18:30 kawa i krotki spacer przy porcie | 18:30–20:00 kolacja w porcie; do Baski Vody dojdzcie tylko, jesli wroci ochota.",
alt:"<b>🟨 Makarska rano zamiast plazy:</b> 08:45 autobus z D8 (15–20 min, 3–5 €, gotowka) → 09:30 Sveti Petar (panorama portu pod Biokovem) → 10:30 Riva → 11:10 opcjonalnie Muzeum Malakologiczne (muszle; 2025: pn.–sob. 9–13, 6 €) → 11:50 plac Kacica i sw. Marek → 12:20 obiad: Gastro Diva (pasticada) albo Papar Grill (cevapi) → 13:20 autobus do Breli; dalej sjesta i wieczor jak w planie glownym | ok. 4–6 km, latwo | <a href=\"https://www.google.com/maps/search/?api=1&query=Sveti%20Petar%20Makarska\" target=\"_blank\" rel=\"noopener\">📍 Sveti Petar</a>",
note:"Lekki dzien po Mostarze. Wysilek: port Brela → centrum Baski Vody ok. 2,3 km / 30–35 min, plasko, w duzej czesci w cieniu sosen; w obie strony ok. 5 km. Zarezerwuj stolik w Bracerze telefonicznie. Godziny orientacyjne, brak rezerwacji."},

{id:12,c:"brela",dt:"Wtorek, 29 czerwca",t:"Omis i Cetina z Breli",s:"Mirabela, soparnik i rejs kanionem Cetiny — krotki wypad autobusem (ok. 23 km)",i:[
{t:"07:45–08:30",d:"Sniadanie; przy noclegu blisko glownego przystanku pasuje <b>Sampion</b> przy D8 (od 7:00). Woda, nakrycie glowy, buty z przyczepnoscia, stroj kapielowy",r:{n:"Sampion",d:"przy D8 | od 7:00 | blisko glownego przystanku"}},
{t:"08:30–09:15",d:"Podejscie na przystanek na D8 (z portu 15–20 min pod gore albo taksowka) i autobus w strone Splitu (kazdy kurs w kierunku Splitu jedzie przez Omis) | bilet ok. <b>3–6 EUR</b> gotowka u kierowcy"},
{t:"09:15–09:45",d:"Jazda do Omisa (ok. 23 km, 23–30 min), wysiadka na <b>Fosal</b> (centrum, przy ujsciu Cetiny) | <a href=\"https://www.google.com/maps/search/?api=1&query=Autobusni%20kolodvor%20Omi%C5%A1%20Fo%C5%A1al\" target=\"_blank\" rel=\"noopener\">Omis — przystanek Fosal</a>"},
{t:"09:45–11:00",d:"Starowka → kosciol <b>sw. Michala</b> → twierdza <b>Mirabela</b>. Z gory: dachy, ujscie Cetiny i morze. Strome schody i waskie koncowe wejscie | bilet i godziny na miejscu | przy leku wysokosci zostancie nizej | <a href=\"https://www.google.com/maps/search/?api=1&query=Mirabela%20Fortress%20Omis\" target=\"_blank\" rel=\"noopener\">Mirabela</a> · <a href=\"https://www.visitomis.hr/en/cultural-and-historical-heritage\" target=\"_blank\" rel=\"noopener\">Dziedzictwo Omisa</a>"},
{t:"11:00–11:45",d:"Uliczki i kawa; <b>Dom Szczesliwego Czlowieka</b> to drobny dodatek — fasada z inskrypcja, jesli traficie po drodze"},
{t:"11:45–13:00",d:"Obiad: <b>soparnik</b>, jesli dostepny, albo grill",r:{n:"Restaurant Libero",d:"Knezova Kacica 29 | soparnik albo grill | ALT: Pizzeria Antula — Matije Gubca 9"}},
{t:"13:00–15:00",d:"<b>Rejs po Cetinie do Radmanove Mlinice</b>: ok. 2 h (40 min w gore rzeki, 40 min postoju przy dawnym mlynie, 40 min powrotu) | ok. <b>20–25 EUR/os.</b> | start z nabrzeza przy ul. Josipa Pupacica, bilety na miejscu lub online | kanion z pionowymi scianami w zasiegu reki | <a href=\"https://www.google.com/maps/search/?api=1&query=Cetina%20bridge%20Omis\" target=\"_blank\" rel=\"noopener\">Most na Cetinie</a>"},
{t:"15:00–16:00",d:"Opcjonalnie <b>Velika plaza</b> przy ujsciu rzeki; przy zmeczeniu prosto na przystanek | <a href=\"https://www.google.com/maps/search/?api=1&query=Velika%20plaza%20Omis\" target=\"_blank\" rel=\"noopener\">Velika plaza</a>"},
{t:"16:00–17:00",d:"Autobus w strone Makarskiej, wysiadka na wlasciwym przystanku w Breli"},
{t:"17:00–18:30",d:"Prysznic i pakowanie. Potwierdz jutrzejszy autobus do Dubrownika, przystanek i <b>taksowke z walizka na D8</b>"},
{t:"19:00–21:00",d:"Pozegnalna kolacja w <b>Ivandica Dvori</b> — najwyzej oceniany lokal w Breli, z darmowym dowozem i zachodem slonca. Rezerwacja telefonicznie. Zamiennik: <b>Katara z peka</b> (zamowiona dzien wczesniej)",r:{n:"Ivandica Dvori",d:"najwyzej oceniany lokal w Breli | darmowy dowoz | zachod slonca | rezerwacja telefonicznie | ALT: Katara (peka dzien wczesniej)"}}],
w:"Deszcz / burza: Omis zamien z dniem 28.06 — rejs i Mirabela nie sa planem na burze. Odpusc najpierw plaze, potem Mirabele — rejs i obiad zostaja.",
sp:"Bez Omisa; plaza po pn-zach stronie Breli: 09:00–10:00 sniadanie | 10:00–12:30 Podrace albo Stomarica | 12:30–14:00 lunch w LA Bomba | 14:00–17:30 odpoczynek i pakowanie | 19:00–21:00 pozegnalna kolacja (Ivandica Dvori albo Feral).",
alt:"<b>Wariant sportowy zamiast rejsu:</b> Rafting na Cetinie 35–50 EUR/os., 3–4 h, zbiorka w Omisie, dowoz na start w cenie — np. Adriaturist codziennie o 8:30 i 14:00 (sezon 2026); przy 8:30 wyjedz z Breli ok. 7:30 | Kajak + snorkeling od ok. 40 EUR/os., 3 h (najblizszy odpowiednik dawnego splywu Zrmanja) | Canyoning 50–85 EUR/os., 4,5–6 h, dla sprawnych, skoki i zjazdy. Rafting o 14:00 zastepuje rejs i plaze; Mirabela i obiad zostaja rano. Odbioru z Breli nie potwierdzono — zapytaj o „pick-up Brela”, ale autobus jest najprostszy. Ceny z platform 2025–2026, na 2027 do potwierdzenia. <a href=\"https://www.visitomis.hr/en/tourist-agencies?page=3\" target=\"_blank\" rel=\"noopener\">Agencje w Omisie</a>. <br><b>Fortica zamiast Mirabeli i rejsu:</b> z centrum przez Vangrad → Put Borka → oznaczony szlak, ok. 3 h na wejscie, widok i zejscie, umiarkowanie trudno po kamieniach; tylko przy suchej pogodzie i z zapasem wody. <a href=\"https://www.google.com/maps/search/?api=1&query=Starigrad%20Fortress%20Fortica%20Omis\" target=\"_blank\" rel=\"noopener\">Mapa</a>.",
note:"<b>Ostatni dzien w Breli</b> — wtorek, pelny rozklad; zapisz co najmniej dwa kursy powrotne, bo wieczorem pakowanie. Taksowka Omis → Brela ok. 45–60 EUR. Rozklady na 2027: <a href=\"https://www.promet-makarska.hr/\" target=\"_blank\" rel=\"noopener\">Promet Makarska</a> · <a href=\"https://www.arriva.com.hr/\" target=\"_blank\" rel=\"noopener\">Arriva</a>. Wysilek: autobus 23–30 min w jedna strone, w Omisie ok. 3–5 km, Mirabela ma strome schody — latwo do umiarkowanie. Peke w Katarze zamow dzien wczesniej."},

// ===== DUBROWNIK =====
{id:13,c:"dubrovnik",dt:"Sroda, 30 czerwca",t:"Brela → Dubrownik — przyjazd i pierwsza petla po starowce",s:"Noc 1/4 w Dubrowniku | przejazd ok. 4,5–6,5 h od drzwi do drzwi, potem 2–3 km pieszo, latwo, bez murow i wysokich podejsc",i:[
{t:"08:00–09:00",d:"Sniadanie, prowiant, woda i wymeldowanie"},
{t:"09:00–10:00",d:"Dojazd na wlasciwy przystanek i zapas przed kursem. W Breli zamowcie taksowke z walizka na przystanek przy D8 (zwykle glowny „Brela”). Wybierzcie kurs bezposredni do Dubrownika albo sprawdzona przesiadke w Makarskiej. Przystanek i warunki przewozu walizki sprawdzcie na bilecie u <a href=\"https://www.arriva.com.hr/\" target=\"_blank\" rel=\"noopener\">Arrivy</a> lub <a href=\"https://www.flixbus.pl/\" target=\"_blank\" rel=\"noopener\">FlixBusa</a>"},
{t:"10:00–14:30",d:"Robocze okno przejazdu do Gruzu (<a href=\"https://www.google.com/maps/search/?api=1&query=Autobusni%20kolodvor%20Dubrovnik\" target=\"_blank\" rel=\"noopener\">📍 Dworzec Gruz</a>). Faktyczny rozklad i korki moga przesunac caly dzien. <b>🛂 Neum:</b> czesc kursow przejezdza przez krotki odcinek Bosni i Hercegowiny z kontrola graniczna — dowod lub paszport trzymajcie przy sobie, nie w walizce w luku. Kursy przez most Peljesac omijaja granice"},
{t:"14:30–15:30",d:"Z dworca w Gruzu do wybranego hotelu i zameldowanie, bez zwiedzania z bagazem"},
{t:"15:30–17:30",d:"Prysznic, posilek i odpoczynek. Jesli nocleg jest w rejonie Lapadu/Gruzu i rzeczywista trasa tamtedy prowadzi, Zamagna sprawdzi sie na pizze. Przy poznym przyjezdzie zjedzcie po prostu przy hotelu",r:{n:"Zamagna",d:"pizza | rejon Lapadu/Gruzu | tylko jesli po drodze"}},
{t:"17:30–18:15",d:"Jeden dojazd do Pile. Nie ustalajcie sztywnej rezerwacji na godzine, ktorej przejazd moze nie pozwolic dotrzymac"},
{t:"18:15–19:15",d:"🟦 Fontanna Onufrego → Stradun → Luza → port (<a href=\"https://www.google.com/maps/dir/?api=1&origin=Pile%20Gate%20Dubrovnik&destination=Old%20Port%20Dubrovnik&waypoints=Stradun%20Dubrovnik%7CLuza%20Dubrovnik&travelmode=walking\" target=\"_blank\" rel=\"noopener\">🗺️ Spacer: Pile → Stradun → port</a>). Przy fontannie spojrzcie na fasade kosciola sw. Zbawiciela; na Luzy zobaczcie z zewnatrz Sponze, wieze zegarowa i kosciol sw. Blazeja. Naturalne przystanki w marszu, bez osobnych biletow"},
{t:"19:15–19:40",d:"Port i katedra z zewnatrz. Z portu wracajcie w strone zachodnia przez okolice katedry i Od Puca (<a href=\"https://www.google.com/maps/dir/?api=1&origin=Dubrovnik%20Cathedral&destination=Pile%20Gate%20Dubrovnik&waypoints=Od%20Puca%20Dubrovnik%7CRepublic%20Burger%20House%20Dubrovnik&travelmode=walking\" target=\"_blank\" rel=\"noopener\">🗺️ Katedra → Od Puca → Republic → Pile</a>) — kolacja lezy na drodze do Pile, zamiast wymuszac ponowny marsz przez caly Stradun"},
{t:"19:40–20:45",d:"🍽️ Kolacja. Burger wolowy lub cevapi, jesli sa w biezacej karcie",r:{n:"Republic Burger House",d:"Siroka 4 | burger wolowy lub cevapi | 15–20 EUR/os (deklarowane) | Google 4,8/5, 3197 ocen | sprawdzcie doplate za obsluge i cene konkretnego zamowienia"}},
{t:"20:45–21:30",d:"Pile i powrot do hotelu. Ostatnie zdjecie oswietlonego Stradunu po drodze; bez kolejnego baru wpisanego jako obowiazek"}],
w:"Zostawcie wieczor elastyczny, spacerujcie tylko po poprawie pogody. Nie zastepujcie go mokrymi schodami na Lovrijenac. <b>Ston odpuszczamy w zwyklym autobusie</b> — postoj wymaga wczesniej umowionego prywatnego transferu, zabezpieczenia bagazu i dodatkowego czasu kosztem tego wieczoru.",
sp:"Trasa: Brela → Gruz → hotel → Pile → Dubravka → Stradun → Luza → Pile → hotel; wieczorem ok. 1–1,5 km, bez schodow na mury i bez obowiazkowego portu (okna transferu wg tego samego kursu co w planie glownym). 08:00–09:00 sniadanie, prowiant, wymeldowanie | 09:00–15:30 przystanek, autobus, dojazd z Gruzu i zameldowanie (przy pozniejszym kursie skroccie wieczor) | 15:30–17:30 posilek przy hotelu, prysznic, odpoczynek | 17:30–18:15 dojazd do Pile, jedno wyjscie do centrum | 18:15–19:15 spokojna kolacja w Dubravce przy Pile, wg biezacej karty i budzetu | 19:15–20:00 fontanna Onufrego → Stradun → Luza → Pile, tylko glowna os | 20:00–21:00 powrot do hotelu z zapasem na autobus | 21:00–22:00 odpoczynek, woda, sprawdzenie pogody na trzy pelne dni.",
alt:"🟨 <b>Maly dodatek:</b> przy spokojnym morzu przed kolacja podejdzcie na <b>Porporele</b> za twierdza sw. Jana — ok. 15–20 min dodatkowo, krotki powrot tym samym nabrzezem; widok portu i murow blisko glownej trasy (<a href=\"https://www.google.com/maps/search/?api=1&query=Porporela%20Dubrovnik\" target=\"_blank\" rel=\"noopener\">Mapa Porporeli</a>). <b>✂️ Wersja krotka:</b> Pile → Stradun → Luza → Pile, ok. 1–1,5 km; kolacja w Dubravce przy Pile albo przy hotelu. Jesli zmeczyl Was przejazd, sam posilek i odpoczynek wystarcza — port zostaje na dzien 02.07.",
note:"Godziny orientacyjne, daty robocze — brak rezerwacji; wybierzcie plan glowny albo spokojny. Pozny przyjazd = krotszy wieczor (petla Pile–Pile z posilkiem ok. 2,5–3 h). Na Neum dokumenty przy sobie. Zrodla sprawdzone 25.09.2026, oceny Google 24.09.2026 — sezon 2027 do potwierdzenia."},

{id:14,c:"dubrovnik",dt:"Czwartek, 1 lipca",t:"Mury miejskie — 1940 m",s:"Poranna petla murow, Dubravka i zachodnia zatoka | ok. 4–5 km (z Lovrijenacem 5–6 km), srednio, w upale ciezko | noc 2/4, zamiennie z dniem 02.07",i:[
{t:"06:30–07:00",d:"Sniadanie, woda i przygotowanie do murow. Jesli hotel nie podaje jeszcze sniadania — uzgodnijcie pakiet poprzedniego dnia. Nakrycie glowy i wygodne buty"},
{t:"07:00–07:45",d:"Dojazd do Pile i dojscie do wejscia. Z dalszego hotelu ruszcie wczesniej, jesli wymaga tego rozklad | <a href=\"https://www.google.com/maps/search/?api=1&query=Dubrovnik%20City%20Walls%20Pile%20Entrance\" target=\"_blank\" rel=\"noopener\">📍 Wejscie przy Pile</a>"},
{t:"07:45–08:00",d:"Bilet / wazny Pass i oczekiwanie przy wejsciu. Badzcie 15–20 min przed potwierdzonym otwarciem; caly poranek przesuncie, jesli w 2027 otwarcie bedzie inne"},
{t:"08:00–10:30",d:"<b>Pelna petla murow</b> (1940 m, 2–2,5 h) — przeciwnie do wskazowek zegara: Pile (wejscie przy sw. Zbawicielu) → Bokar i odcinek nad morzem (widok na Lovrijenac) → sw. Jan i port → polnocne mury → <b>Minceta na koniec</b> → zejscie przy Pile. Bez odwrotnego kierunku i bez przerwy z ponownym wejsciem. Godzina 08:00 to zalozenie — dopasujcie do sezonu 2027. Platne bary po drodze tylko jako odpoczynek, nie tani obiad. Na miejscu obowiazuja strzalki i polecenia obslugi | <a href=\"https://citywallsdubrovnik.hr/the-city-walls/\" target=\"_blank\" rel=\"noopener\">Oficjalny opis murow</a> | <a href=\"https://tzdubrovnik.hr/lang/en/get/spomenici/5300/entrada_principal_a_las_murallas_de_la_ciudad.html\" target=\"_blank\" rel=\"noopener\">Wejscie Pile (TZ Dubrovnik)</a> | <a href=\"https://www.kompas.hr/dubrovnik/attractions/city-walls\" target=\"_blank\" rel=\"noopener\">Kierunek (Kompas)</a>"},
{t:"10:30–12:00",d:"Dluga przerwa po murach — brunch albo prosty lunch, zaleznie od karty i godzin kuchni. Stolik w cieniu lub wewnatrz",r:{n:"Dubravka 1836",d:"Przy Pile, Brsalje 1 | jajka z boczkiem / lasagne / kurczak z gnocchi | 15–45 EUR/os (sprawdz cene dania) | Google 4,6 (9078 ocen)"}},
{t:"12:00–12:30",d:"Brsalje i zachodnia zatoka — krotki widok murow od zewnatrz i odpoczynek przy wodzie. <b>Lovrijenac tylko zamiast czesci nastepnego bloku</b> (podejscie i wnetrze ok. 45–60 min, kolejne schody) — w upale po murach spokojnie pominac | <a href=\"https://www.google.com/maps/search/?api=1&query=Lovrijenac%20Dubrovnik\" target=\"_blank\" rel=\"noopener\">📍 Lovrijenac</a> | <a href=\"https://www.google.com/maps/dir/?api=1&origin=Dubravka%201836%20Dubrovnik&destination=Gradac%20Park%20Dubrovnik&waypoints=West%20Harbour%20Dubrovnik&travelmode=walking\" target=\"_blank\" rel=\"noopener\">🗺️ Dubravka → zatoka → Gradac</a>"},
{t:"12:30–14:00",d:"Jeden spokojny punkt: Gradac (zielen, cien) <b>albo</b> Sulic (mala plaza, schody) — odpoczynek na siedzaco lub krotka kapiel przy spokojnej wodzie, bez trasy przez oba. Duszno / brak miejsca → od razu do hotelu | <a href=\"https://www.google.com/maps/search/?api=1&query=Gradac%20Park%20Dubrovnik\" target=\"_blank\" rel=\"noopener\">📍 Gradac</a> | <a href=\"https://www.google.com/maps/search/?api=1&query=Sulic%20Beach%20Dubrovnik\" target=\"_blank\" rel=\"noopener\">📍 Sulic</a>"},
{t:"14:00–15:00",d:"Powrot przez Pile do hotelu (dojscie do Pile konieczne dla autobusu). Bez drugiego wyjazdu na starowke tego wieczoru"},
{t:"15:00–18:00",d:"Prysznic i pelny odpoczynek w hotelu"},
{t:"18:00–19:30",d:"Kolacja przy noclegu. Zamagna tylko przy wygodnym dojsciu z Waszej czesci Lapadu/Gruzu — z Palace lub Babin Kuk nie warto jechac specjalnie po pizze"},
{t:"19:30–21:00",d:"Spokojny wieczor i przygotowanie plecakow na Lokrum; bez drugiego dojazdu do centrum"}],
w:"Deszcz lub burza: mury przelozcie na dzien 02.07, a Lokrum na dzis tylko przy dobrej pogodzie na wyspie i potwierdzonych rejsach. Przy deszczu lepszy Palac Rektorow (wariant pogodowy dnia 02.07). Najpierw odpuszczamy: dodatkowa twierdze, Srd i kolejne muzea — odpoczynek po murach zostaje.",
sp:"Bez murow, ok. 2–3 km + hotel (do parku/plazy nadal schody): 08:00–09:00 sniadanie w hotelu | 09:00–10:00 dojazd do Pile i dojscie na Brsalje | 10:00–11:00 Brsalje → zachodnia zatoka, widoki murow i twierdzy z dolu | 11:00–12:30 Gradac (cien) albo Sulic (krotka kapiel) — jedno | 12:30–14:00 spokojny posilek w Dubravce przy powrocie do Pile | 14:00–15:00 powrot do hotelu | 15:00–18:00 prysznic i odpoczynek | 18:00–19:30 kolacja przy noclegu i sprawdzenie rejsow na Lokrum. Wybor tego wariantu = pominiecie murow dzis; przelozenie wymaga zamiany z Lokrum.",
alt:"<b>Srd zamiast Lovrijenaca, parku i wczesnego powrotu</b> (panorama dzienna, bez czekania na zachod): 10:30–13:00 dlugi posilek i odpoczynek po murach | 13:00–14:00 Pile → Stradun → Ploce → dolna stacja kolejki (dojscie 25–35 min) | 14:00–16:00 kolejka w obie strony i tarasy widokowe | 16:00–17:00 powrot do hotelu, odpoczynek i kolacja przy noclegu. Bez pieszego zejscia ze Srd. Tylko przy dobrej widocznosci i dzialajacej kolejce (wstrzymana przy silnym wietrze/burzy). 30 EUR/os w obie strony = 60 EUR dla dwojga (2027 niepotwierdzone) | <a href=\"https://www.dubrovnikcablecar.com/timetable-and-prices/\" target=\"_blank\" rel=\"noopener\">Oficjalna kolejka</a> | <a href=\"https://www.google.com/maps/search/?api=1&query=Dubrovnik%20Cable%20Car%20Lower%20Station\" target=\"_blank\" rel=\"noopener\">📍 Dolna stacja</a><br><b>Wersja krotka:</b> mury → dlugi posilek przy Pile → hotel, ok. 2,5–3,5 km. Jesli przed zakupem biletu wiecie, ze schody sa za ciezkie: Pile → zatoka → Gradac, bez murow.",
note:"Mury: 2–2,5 h na pelna petle, wielokrotne schody, malo cienia. <b>Brak ponownego wejscia na tym samym bilecie</b> — wczesniej mozna wyjsc tylko przy dostepnym wyjsciu wskazanym przez obsluge (<a href=\"https://citywallsdubrovnik.hr/faq/\" target=\"_blank\" rel=\"noopener\">regulamin</a>). Nawigacja Google nie zastepuje przebiegu platnej trasy. Godziny orientacyjne, brak rezerwacji; zrodla sprawdzone 25.09.2026, sezon 2027 do potwierdzenia."},

{id:15,c:"dubrovnik",dt:"Piatek, 2 lipca",t:"Lokrum i spokojny spacer po starowce",s:"Wyspa: ogrod botaniczny, klasztor, Mrtvo more | powrot przez katedre i schody jezuickie | noc 3/4, zamiennie z dniem 01.07",i:[
{t:"07:15–08:00",d:"Sniadanie i pakowanie plecaka: woda, prowiant na obiad, recznik, stroj kapielowy i suche ubranie na pozniejszy posilek"},
{t:"08:00–09:00",d:"Dojazd do Pile i przejscie bez dodatkowego zwiedzania prosto do starego portu. Przy dalszym hotelu zacznijcie wczesniej, jesli wymaga tego wybrany rejs | <a href=\"https://www.google.com/maps/search/?api=1&query=Lokrum%20ferry%20Old%20Port%20Dubrovnik\" target=\"_blank\" rel=\"noopener\">📍 Stary port i rejsy Lokrum</a>"},
{t:"09:00–10:00",d:"🟦 Bilet i rejs wedlug aktualnego rozkladu. Poranny kurs, ale 09:00 to <b>nie potwierdzone odplyniecie</b> w czerwcu 2027. Juz przy zakupie ustalcie powrot ok. 14:00–15:00 i pozniejszy kurs zapasowy"},
{t:"10:00–11:15",d:"Portoc → ogrod botaniczny → klasztor i ogrody — zwarty poludniowy fragment wyspy, glowny spacer. Nie zaczynajcie od wspinania sie na drugi koniec wyspy | <a href=\"https://www.lokrum.hr/en/historical-gardens\" target=\"_blank\" rel=\"noopener\">Ogrody Lokrum</a> · <a href=\"https://www.lokrum.hr/en/cultural-heritage\" target=\"_blank\" rel=\"noopener\">Dziedzictwo wyspy</a> · <a href=\"https://www.lokrum.hr/en/map-of-lokrum\" target=\"_blank\" rel=\"noopener\">🗺️ Oficjalna mapa Lokrum</a>"},
{t:"11:15–12:15",d:"Mrtvo more i odpoczynek — niewielki slony zbiornik polaczony z morzem; kapiel opcjonalnie, jesli warunki i dostep sa odpowiednie. Nie trzeba zastepowac jej wejsciem na odsloniete skaly od strony otwartego morza | <a href=\"https://www.lokrum.hr/en/nature\" target=\"_blank\" rel=\"noopener\">Przyroda Lokrum</a>"},
