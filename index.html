<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRO 2027">
<meta name="theme-color" content="#0c1220">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Chorwacja 2027</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--f:'DM Sans',system-ui,sans-serif;--fs:'Playfair Display',Georgia,serif;
--z:#0ea5e9;--s:#a855f7;--b:#f97316;--d:#10b981;
--bg:#fafaf9;--card:#fff;--brd:#e7e5e4;--tx:#1c1917;--tx2:#78716c;--tx3:#a8a29e;
--r:16px;--sh:0 1px 3px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.06)}
html{font-family:var(--f);color:var(--tx);scroll-behavior:smooth;background:var(--bg)}
body{overflow-x:hidden}
button{font-family:var(--f);cursor:pointer;border:none;background:none}

.hero{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;
position:relative;overflow:hidden;background:#0c1220;color:#fff;text-align:center;padding:40px 24px}
.hero-bg{position:absolute;inset:0;background:linear-gradient(135deg,#0c1220 0%,#164e63 30%,#0e7490 50%,#0891b2 65%,#f59e0b 85%,#ea580c 100%);opacity:.7;animation:hs 20s ease-in-out infinite alternate}
@keyframes hs{0%{filter:hue-rotate(0) brightness(1)}50%{filter:hue-rotate(-15deg) brightness(1.1)}100%{filter:hue-rotate(10deg) brightness(.95)}}
.hero-ov{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 80%,rgba(0,0,0,.3),transparent 70%)}
.hero-c{position:relative;z-index:1;max-width:800px}
.hero-c .flag{font-size:56px;margin-bottom:20px;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
.hero h1{font-family:var(--fs);font-size:clamp(36px,7vw,72px);font-weight:800;line-height:1.1;letter-spacing:-1px;margin-bottom:12px;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.hero .sub{font-size:clamp(14px,2.5vw,20px);opacity:.7;margin-bottom:36px;letter-spacing:1px}
.hero-st{display:flex;gap:32px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.hero-st div{text-align:center}
.hero-st .v{font-family:var(--fs);font-size:clamp(28px,4vw,44px);font-weight:700;display:block;line-height:1.2}
.hero-st .l{font-size:12px;opacity:.5;text-transform:uppercase;letter-spacing:2px;margin-top:2px}
.hero-rt{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;font-size:clamp(13px,2vw,16px);font-weight:600;opacity:.8}
.hero-rt .a{opacity:.3;font-size:18px}
.hero-sc{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);z-index:1;font-size:12px;opacity:.4;letter-spacing:2px;text-transform:uppercase;animation:bd 2s ease-in-out infinite}
@keyframes bd{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

.tn{position:sticky;top:0;z-index:50;background:rgba(250,250,249,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--brd);padding:0 24px;transition:box-shadow .3s}
.tn.sc{box-shadow:0 1px 8px rgba(0,0,0,.06)}
.tn-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;height:56px;gap:4px}
.tn-br{font-family:var(--fs);font-weight:700;font-size:18px;margin-right:auto;white-space:nowrap}
.tn-br span{opacity:.4;font-weight:400}
.tb{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--tx2);transition:all .2s;white-space:nowrap}
.tb:hover{background:rgba(0,0,0,.04)}.tb.on{color:var(--tx);background:rgba(0,0,0,.06)}
.tn-pg{display:flex;align-items:center;gap:8px;margin-left:12px}
.tn-bar{width:80px;height:4px;background:var(--brd);border-radius:2px;overflow:hidden}
.tn-fl{height:100%;border-radius:2px;background:var(--d);transition:width .5s}
.tn-pc{font-size:13px;font-weight:700;color:var(--d)}
@media(max-width:768px){.tb{padding:6px 8px;font-size:11px}.tn-pg{display:none}.tn-in{gap:1px}}

.sec{display:none;max-width:900px;margin:0 auto;padding:32px 20px 80px}.sec.on{display:block}

.ci{margin-bottom:32px;padding:40px 0 32px;border-bottom:1px solid var(--brd)}
.ci .cl{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
.cl.zadar{color:var(--z)}.cl.split{color:var(--s)}.cl.brela{color:var(--b)}.cl.dubrovnik{color:var(--d)}
.ci h2{font-family:var(--fs);font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.15;letter-spacing:-1px;margin-bottom:6px}
.ci .cm{font-size:15px;color:var(--tx2)}

.dc{position:relative;margin-bottom:16px;background:var(--card);border:1px solid var(--brd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:all .25s}
.dc:hover{box-shadow:0 2px 6px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.08)}
.dc.dn{border-color:rgba(16,185,129,.25);background:linear-gradient(135deg,#f0fdf4,#ecfdf5)}

.dh{display:flex;align-items:center;gap:14px;padding:18px 20px;cursor:pointer;-webkit-user-select:none}
.dd{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--fs);font-weight:800;font-size:16px;color:#fff;flex-shrink:0}
.dd.zadar{background:var(--z)}.dd.split{background:var(--s)}.dd.brela{background:var(--b)}.dd.dubrovnik{background:var(--d)}
.dc.dn .dd{background:var(--d)}
.dh-i{flex:1;min-width:0}
.dh-dt{font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:2px}
.dh-t{font-size:16px;font-weight:700;line-height:1.3}
.dh-s{font-size:13px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.dh-p{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;background:#f5f5f4;color:var(--tx3)}
.dc.dn .dh-p{background:rgba(16,185,129,.1);color:var(--d)}
.dh-a{font-size:20px;color:var(--tx3);transition:transform .3s}
.dc.op .dh-a{transform:rotate(90deg)}

.db{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.4,0,.2,1)}
.dc.op .db{max-height:6000px}
.db-in{padding:0 20px 24px}
.db-dv{height:1px;background:var(--brd);margin-bottom:20px}

.ti{display:flex;gap:14px;position:relative;padding-bottom:14px}
.ti:last-of-type{padding-bottom:0}
.tl{position:relative;width:20px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.tl::before{content:'';position:absolute;top:12px;bottom:0;width:1.5px;background:var(--brd)}
.ti:last-of-type .tl::before{display:none}
.tc{width:20px;height:20px;border:2px solid #d6d3d1;border-radius:6px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:1;flex-shrink:0}
.tc:hover{border-color:#a8a29e}.tc:active{transform:scale(.9)}
.tc.on{background:var(--d);border-color:var(--d)}
.tc.on::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ti-c{flex:1;min-width:0;padding-top:1px}
.ti-t{font-size:12px;font-weight:700;color:var(--tx);margin-bottom:2px}
.ti-d{font-size:14px;color:var(--tx2);line-height:1.5}
.ti.ck .ti-d{text-decoration:line-through;opacity:.4}

.rc{display:flex;gap:12px;background:#fffbeb;border:1px solid #fef3c7;border-radius:12px;padding:12px 14px;margin:8px 0 4px}
.rc .ri{font-size:20px;flex-shrink:0}.rc .rn{font-weight:700;font-size:13px}.rc .rd{font-size:12px;color:var(--tx2);margin-top:2px;line-height:1.4}

.wn{display:flex;gap:10px;background:#f0f9ff;border:1px solid #e0f2fe;border-radius:12px;padding:12px 14px;margin-top:16px;font-size:13px;color:#0c4a6e;line-height:1.5}
.wn span:first-child{flex-shrink:0;font-size:16px}

.sn{display:flex;gap:10px;background:#fdf4ff;border:1px solid #f5d0fe;border-radius:12px;padding:12px 14px;margin-top:8px;font-size:13px;color:#86198f;line-height:1.5}
.sn span:first-child{flex-shrink:0;font-size:16px}

.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.mc{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.mc h3{font-family:var(--fs);font-size:20px;font-weight:700;margin-bottom:16px}
.mi{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f5f5f4}.mi:last-child{border-bottom:none}
.mi .me{font-size:20px;flex-shrink:0;width:28px;text-align:center}
.mi .mn{font-weight:700;font-size:13px}.mi .md{font-size:12px;color:var(--tx2)}
.pht{width:100%;border-collapse:collapse;font-size:13px}
.pht th{text-align:left;padding:8px 4px;font-size:11px;color:var(--tx3);border-bottom:2px solid var(--brd);font-weight:700}
.pht td{padding:8px 4px;border-bottom:1px solid #f5f5f4}.pht td:last-child{color:var(--tx2);font-style:italic}

.ft{text-align:center;padding:48px 24px;border-top:1px solid var(--brd);color:var(--tx3);font-size:13px}
.ft .ff{font-size:32px;margin-bottom:8px;display:block}

/* === PHOTOS === */
.ti-wrap{display:flex;gap:12px;align-items:flex-start}
.ti-c{flex:1;min-width:0}
.ti-ph{width:80px;height:60px;border-radius:10px;object-fit:cover;flex-shrink:0;cursor:pointer;
background:#e7e5e4;transition:transform .2s,opacity .3s;box-shadow:0 2px 8px rgba(0,0,0,.1);opacity:0}
.ti-ph.loaded{opacity:1}
.ti-ph:hover{transform:scale(1.05)}
@media(min-width:640px){.ti-ph{width:100px;height:72px}}

/* === LIGHTBOX === */
.lb{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:flex;align-items:center;
justify-content:center;flex-direction:column;gap:12px;padding:20px;cursor:pointer;
opacity:0;pointer-events:none;transition:opacity .25s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.lb.show{opacity:1;pointer-events:auto}
.lb img{max-width:100%;max-height:75vh;border-radius:14px;object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.lb-cap{color:rgba(255,255,255,.7);font-size:14px;text-align:center;max-width:500px}
.lb-close{position:absolute;top:20px;right:20px;color:#fff;font-size:28px;opacity:.5;cursor:pointer;
width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;
background:rgba(255,255,255,.1);transition:opacity .2s}
.lb-close:hover{opacity:1}

@media(max-width:640px){.ci{padding:24px 0 20px}.dh{padding:14px 16px;gap:10px}.db-in{padding:0 16px 20px}.mg{grid-template-columns:1fr}}
</style>
</head>
<body>

function gc(id){const r=localStorage.getItem('cro_'+id);if(!r)return new Array(D.find(d=>d.id===id).i.length).fill(false);return JSON.parse(r)}

// === RENDER (only once on load) ===
function render(){
  for(const[c,m]of Object.entries(M)){
    const sec=document.getElementById('s-'+c),days=D.filter(d=>d.c===c);
    let h=`<div class="ci"><div class="cl ${c}">${m.n}</div><h2>${m.sub}</h2><p class="cm">${m.dt}</p></div>`;
    for(const day of days){
      const ch=gc(day.id),dn=ch.filter(Boolean).length,tot=day.i.length,ok=dn===tot&&tot>0;
      h+=`<div class="dc${ok?' dn':''}" id="d${day.id}">`;
      h+=`<div class="dh" onclick="td(${day.id})"><div class="dd ${c}">${day.id}</div>`;
      h+=`<div class="dh-i"><div class="dh-dt">${day.dt}</div><div class="dh-t">${day.t}</div><div class="dh-s">${day.s}</div></div>`;
      h+=`<div class="dh-r"><span class="dh-p" id="p${day.id}">${dn}/${tot}</span><span class="dh-a">›</span></div></div>`;
      h+=`<div class="db"><div class="db-in"><div class="db-dv"></div>`;
      for(let i=0;i<day.i.length;i++){
        const it=day.i[i],on=ch[i];
        h+=`<div class="ti${on?' ck':''}" id="ti${day.id}_${i}"><div class="tl"><div class="tc${on?' on':''}" onclick="tc(${day.id},${i},event)"></div></div>`;
        // find photo match
        let wiki='';
        for(const[kw,wt]of Object.entries(PHOTOS)){if(it.d.includes(kw)||it.t.includes(kw)){wiki=wt;break}}
        h+=`<div class="ti-wrap">`;
        h+=`<div class="ti-c"><div class="ti-t">${it.t}</div><div class="ti-d">${it.d}</div>`;
        if(it.r)h+=`<div class="rc"><span class="ri">🍽</span><div><div class="rn">${it.r.n}</div><div class="rd">${it.r.d}</div></div></div>`;
        h+=`</div>`;
        if(wiki)h+=`<img class="ti-ph" data-wiki="${wiki}" alt="" onclick="openLb(this,event)" loading="lazy">`;
        h+=`</div></div>`;
      }
      if(day.w)h+=`<div class="wn"><span>🌧</span><span>${day.w}</span></div>`;
      if(day.sp)h+=`<div class="sn"><span>😌</span><span><b>Spokojniej:</b> ${day.sp}</span></div>`;
      if(day.alt)h+=`<div class="sn"><span>🔄</span><span>${day.alt}</span></div>`;
      if(day.note)h+=`<div class="wn"><span>⚠️</span><span>${day.note}</span></div>`;
      h+=`</div></div></div>`;
    }
    sec.innerHTML=h;
  }
  renderMore();up();
}

// === CHECKBOX TOGGLE — no re-render, no closing! ===
function tc(dayId,idx,e){
  e.stopPropagation();
  const ch=gc(dayId);
  ch[idx]=!ch[idx];
  localStorage.setItem('cro_'+dayId,JSON.stringify(ch));

  // Update just this item
  const item=document.getElementById('ti'+dayId+'_'+idx);
  const box=item.querySelector('.tc');
  if(ch[idx]){box.classList.add('on');item.classList.add('ck')}
  else{box.classList.remove('on');item.classList.remove('ck')}

  // Update counter
  const dn=ch.filter(Boolean).length,tot=ch.length,ok=dn===tot;
  const pEl=document.getElementById('p'+dayId);
  pEl.textContent=dn+'/'+tot;

  // Update card done state
  const card=document.getElementById('d'+dayId);
  if(ok){card.classList.add('dn');pEl.closest('.dh-r')&&pEl.classList.add('ok')}
  else{card.classList.remove('dn')}

  up();
}

}

function openLb(img,e){
  e.stopPropagation();
  const lb=document.getElementById('lb');
  document.getElementById('lb-img').src=img.src.replace(/\/\d+px-/,'/800px-');
  document.getElementById('lb-cap').textContent=img.alt||'';
  lb.classList.add('show');
}

// === PHOTO SYSTEM ===
let photoCache={};
try{photoCache=JSON.parse(localStorage.getItem('cro_ph')||'{}')}catch(e){}

async function getPhotoUrl(wikiTitle){
  if(photoCache[wikiTitle]) return photoCache[wikiTitle];
  try{
    const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(wikiTitle));
    if(!r.ok) return null;
    const j=await r.json();
    if(j.thumbnail&&j.thumbnail.source){
      const url=j.thumbnail.source.replace(/\/\d+px-/,'/400px-');
      photoCache[wikiTitle]={url,alt:j.displaytitle||wikiTitle.replace(/_/g,' ')};
      try{localStorage.setItem('cro_ph',JSON.stringify(photoCache))}catch(e){}
      return photoCache[wikiTitle];
    }
  }catch(e){}
  return null;
}

function applyPhotos(){
  document.querySelectorAll('img[data-wiki]').forEach(async img=>{
    if(img.classList.contains('loaded')) return;
    const wt=img.dataset.wiki;
    const cached=photoCache[wt];
    if(cached){
      img.src=cached.url;img.alt=cached.alt;img.classList.add('loaded');
    } else {
      const data=await getPhotoUrl(wt);
      if(data){img.src=data.url;img.alt=data.alt;img.classList.add('loaded')}
    }
  });
}

// Pre-fetch all unique wiki titles on load
async function prefetchPhotos(){
  const allTitles=[...new Set(Object.values(PHOTOS))];
  const missing=allTitles.filter(t=>!photoCache[t]);
  await Promise.all(missing.map(t=>getPhotoUrl(t)));
  applyPhotos();
}

  if(!w){el.classList.add('op');setTimeout(()=>{applyPhotos();el.scrollIntoView({behavior:'smooth',block:'nearest'})},50)}
}

// Apply when switching tabs too
const origGo=go;
function go(btn){
  const c=btn.dataset.c;
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.getElementById('s-'+c).classList.add('on');
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  window.scrollTo({top:document.getElementById('tn').offsetTop,behavior:'smooth'});
  setTimeout(applyPhotos,100);
}
