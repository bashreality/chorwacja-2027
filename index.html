{t:"12:15–13:30",d:"🍽️ Prowiant i dluzsza przerwa w cieniu, potem dalszy odpoczynek lub niewielki spacer w ogrodach. Nie opieramy dnia na niezweryfikowanej cenie restauracji na wyspie"},
{t:"13:30–15:00",d:"Spokojnie w strone Portoc i rejs powrotny. Badzcie przy przystani z zapasem, dopasujcie okno do wybranego kursu. <b>Nie zostawiajcie powrotu na ostatnia lodz!</b>"},
{t:"15:00–15:45",d:"Katedra → Gunduliceva poljana → schody jezuickie. Katedra z zewnatrz, ewentualnie krotkie wejscie poza nabozenstwem; schody mozna obejrzec od dolu. Krotki ciag na poludnie i na zachod od portu, bez marszu na Banje i z powrotem | <a href=\"https://www.google.com/maps/dir/?api=1&origin=Old%20Port%20Dubrovnik&destination=Taj%20Mahal%20Old%20Town%20Dubrovnik&waypoints=Dubrovnik%20Cathedral%7CJesuit%20Stairs%20Dubrovnik&travelmode=walking\" target=\"_blank\" rel=\"noopener\">🗺️ Powrot pieszo: port → katedra → schody → Taj Mahal</a>"},
{t:"15:45–17:00",d:"🍽️ Pozny obiad / wczesna kolacja w oddziale Old Town. Jesli menu lub kolejka nie pasuja — dalej w strone Pile do Republic",r:{n:"Taj Mahal Old Town",d:"Nikole Gucetica 2 | cevapi w lepinji + ewentualnie kawa po bosniacku | danie z dodatkami do 25 EUR — cena niepotwierdzona | Google 4,5/5 (5732 ocen) | ALT: Republic"}},
{t:"17:00–18:00",d:"Od Puca → Pile → hotel, bez ponownego dojazdu do starego miasta"},
{t:"18:00–19:00",d:"Prysznic i odpoczynek; ewentualnie lekki posilek przy hotelu, jesli jestescie glodni po wczesnej kolacji"},
{t:"19:00–20:00",d:"Spokojny wieczor; kupcie bilety Jadrolinii na jutrzejszy rejs na Lopud (linia 807 z Gruzu, bilet na konkretny kurs)"}],
w:"<b>Nieczynne rejsy przy suchym dniu:</b> ok. 09:30 dojazd do Pile → Stradun → Palac Rektorow <b>albo</b> spokojny spacer przez port i Ploce do Banje (tylko przy warunkach do kapieli — brak deszczu nie oznacza spokojnego morza; <a href=\"https://www.google.com/maps/search/?api=1&query=Banje%20Beach%20Dubrovnik\" target=\"_blank\" rel=\"noopener\">Mapa Banje</a>). Posilek w centrum w drodze powrotnej, hotel ok. 15:00–16:00. <b>Deszcz:</b> ok. 10:00–11:30 Palac Rektorow (kontekst dawnej republiki, wnetrza), potem katedra jesli dostepna, 12:00–13:30 posilek i powrot do hotelu. Otwarcie i cene sprawdz w <a href=\"https://www.dumus.hr/en/cultural-history-museum/\" target=\"_blank\" rel=\"noopener\">Muzeach Dubrownika</a>. Przy ulewie ogranicz dojscia; mury, Srd i skalne brzegi odpadaja. Franciszkanie przy Pile moga zastapic palac, gdy ich godziny bardziej pasuja — wybierz jedno glowne wnetrze. <b>Jesli rejsy nie dzialaja przez trzy pelne dni, odpuszczamy Lokrum</b> — dzien lotu nie jest terminem zapasowym.",
sp:"Zastepuje Lokrum (bez rejsu i bez obowiazkowych schodow jezuickich): hotel → Pile → Stradun → Luza → stary port → katedra z zewnatrz → Od Puca → posilek → Pile → hotel. Ok. 2–3 km plus hotel, latwo. 09:00–10:00 sniadanie i spokojny poranek | 10:00–11:00 dojazd do Pile | 11:00–12:30 Stradun → Luza → port → okolice katedry, przerwy po drodze, wnetrze katedry tylko przy checi i poza nabozenstwem | 12:30–14:00 lunch: Taj Mahal Old Town (po sprawdzeniu ceny) albo Republic dalej na zachod — jeden posilek w drodze ku Pile | 14:00–15:00 Od Puca → Pile → hotel | 15:00–18:00 odpoczynek, prysznic | 18:00–19:00 kolacja przy noclegu, bez drugiego wyjazdu na starowke | 19:00–20:00 odpoczynek i bilety na jutrzejszy Lopud.",
alt:"<b>Fort Royal na Lokrum</b> — tylko zamiast kapieli i czesci poludniowego spaceru: +1–1,5 km i 45–60 min (podejscie, widok, zejscie), bardziej strome i kamieniste; w upale wybierzcie ogrody. Nie laczcie Fort Royal i Srd w jednym dniu wyspiarskim | <a href=\"https://www.google.com/maps/search/?api=1&query=Fort%20Royal%20Lokrum\" target=\"_blank\" rel=\"noopener\">Mapa Fort Royal</a>. <b>✂️ Wersja krotka:</b> ogrod → klasztor → odpoczynek → wczesniejsza lodz, potem posilek i hotel. Jesli wazniejszy jest prysznic zaraz po kapieli: po powrocie Stradunem do Pile, bez schodow, restauracji na starowce i wina; kolacja przy hotelu.",
note:"Obciazenie: ok. 2–3 km na wyspie + 1,5–2,5 km w miescie = <b>3,5–5,5 km</b>, latwo do srednio; kamieniste sciezki i zejscia do wody — dobre buty. Na wyspie ok. 4–5 h z dluga przerwa, nie kazda sciezka. Godziny orientacyjne, brak rezerwacji, rozklad rejsow na 2027 do potwierdzenia (zrodla sprawdzone 25.09.2026). 🟨 <b>Maly dodatek po kolacji:</b> D’vino, Palmoticeva 4a — kieliszek chorwackiego wina, przy zachodniej czesci starowki blisko drogi do Pile; +45–60 min, sprawdz dostepnosc stolika | Google 4,6/5 (833 ocen) | <a href=\"https://www.google.com/maps/search/?api=1&query=D%E2%80%99vino%20Wine%20Bar%20Palmoti%C4%87eva%204a%20Dubrovnik\" target=\"_blank\" rel=\"noopener\">Mapa D’vino</a>."},

{id:16,c:"dubrovnik",dt:"Sobota, 3 lipca",t:"Lopud i piaszczysta plaza Sunj",s:"Statek Jadrolinii z Gruzu na wyspe bez aut, kapiel na piasku | noc 4/4 | rejs ok. 45–50 min, na wyspie 3–4 km, latwo",i:[
{t:"08:30–09:15",d:"Sniadanie; plecak: woda, krem, recznik, stroj, buty do wody, gotowka. <b>Trasa:</b> hotel → port Gruz → statek Jadrolinii (linia 807) → Lopud, port → sciezka przez wyspe → plaza Sunj → port → Gruz → hotel"},
{t:"09:15–09:45",d:"Dojazd do portu Gruz (z Berkeley/Porto kilka minut, z Lapadu autobus) | <a href=\"https://www.google.com/maps/search/?api=1&query=Jadrolinija%20Dubrovnik%20Gru%C5%BE\" target=\"_blank\" rel=\"noopener\">📍 Port Gruz (Jadrolinija)</a>"},
{t:"10:00–10:50",d:"Rejs na Lopud (po drodze Kolocep). Bilet linii 807 jest na <b>konkretny kurs</b> — kupcie dzien wczesniej | lato 2026: ok. 5,40 EUR/os. w jedna strone | <a href=\"https://www.dubrovnik-online.net/dubrovnik-ferry-kolocep-lopud-sipan\" target=\"_blank\" rel=\"noopener\">rozklad i opis</a>"},
{t:"10:50–11:20",d:"Z portu sciezka przez wyspe na <b>Sunj</b> (ok. 25 min, krotkie podejscie) albo meleks ok. 3 EUR | <a href=\"https://www.google.com/maps/search/?api=1&query=Sunj%20beach%20Lopud\" target=\"_blank\" rel=\"noopener\">📍 Plaza Sunj</a>"},
{t:"11:20–14:00",d:"🏖️ <b>Plaza Sunj</b> — piasek, plytkie wejscie do morza, kapiel i cien pod parasolem lub drzewami"},
{t:"14:00–15:00",d:"🍽️ Lunch w beach barze na Sunju albo w porcie Lopudu (grill, pizza) — ceny sprawdz na miejscu",r:{n:"Beach bar Sunj / port Lopud",d:"grill, pizza | ceny na miejscu | gotowka"}},
{t:"15:00–16:30",d:"Jeszcze kapiel albo spacer nabrzezem w porcie (koscioly i ogrody z zewnatrz)"},
{t:"16:30–18:40",d:"Powrot do portu z zapasem i statek do Gruzu (kurs wg biletu; w 2026 m.in. ok. 14:50 i 18:40)"},
{t:"19:00–20:00",d:"Prysznic i pakowanie, dokumenty, sprawdzenie transferu lotniskowego na jutro"},
{t:"20:00–21:30",d:"Pozegnalna kolacja przy hotelu albo w Lapadzie (Zamagna), bez drugiego wyjazdu na starowke"}],
w:"Przy wietrze lub odwolanych rejsach: plan spokojny albo dzien zapasowy na mury lub Lokrum, jesli cos wczesniej odpadlo. Odpusc najpierw spacer po porcie w Lopudzie — plaza i powrot z zapasem zostaja.",
sp:"Bez rejsu, ok. 2–3 km: 09:00–10:00 sniadanie | 10:00–13:00 plaza w zatoce Lapad przy deptaku | 13:00–14:00 lunch na deptaku Lapad | 14:00–17:30 odpoczynek | 17:30–19:00 pakowanie, dokumenty, transfer na jutro | 19:00–20:30 pozegnalna kolacja przy hotelu.",
alt:"<b>🟨 Cavtat zamiast Lopudu:</b> lodz ze starego portu (Adriana, Vivado, Sea Line) ok. 45 min, ok. 15 EUR w jedna strone / 20 EUR w obie strony za osobe, kursy mniej wiecej co godzine 9:30–22:00; tanszy autobus nr 10 ok. 30 min. Mala starowka, promenada i kapiel przy cyplu Rat | <a href=\"https://kompas.hr/cavtat/getting-around/cavtat-dubrovnik-ferry\" target=\"_blank\" rel=\"noopener\">Kompas — lodz do Cavtatu</a>",
note:"Ostatni pelny dzien: morze zamiast kolejnych schodow. Rozklad i ceny Jadrolinii z lata 2026 (odczyt 24.10.2026) — sprawdz na 2027. Bilety tam i z powrotem: ok. 22 EUR za 2 os."},

{id:17,c:"dubrovnik",dt:"Niedziela, 4 lipca",t:"Powrot do Poznania",s:"Wymeldowanie, lotnisko DBV i lot do domu — bez zwiedzania",i:[
{t:"T−5h lub wczesniej",d:"Sniadanie/prowiant, dokumenty, zamkniecie walizki i kontrola statusu lotu. Przy poznym wylocie odbierzcie bagaz z przechowania"},
{t:"T−4h30–T−4h",d:"Wyjazd z hotelu. Przy autobusie uwzglednijcie dojazd na wlasciwy przystanek, przesiadke i oczekiwanie; przy odleglym hotelu wyjdzcie wczesniej (nawet 4,5–5 h przed lotem). Autobus lotniskowy Platanus: <b>Gruz → Grawe → Cable Car → lotnisko</b> — <b>Pile NIE jest przystankiem</b>. Z Berkeley najprosciej start na dworcu Gruz; z Lapadu/Babin Kuk porownajcie dojazd do Gruzu z transferem z hotelu. 10 EUR/os. w jedna strone (jedna walizka w cenie), 20 EUR za 2 os. + dojazd do przystanku; bilet kupic przed wejsciem do autobusu (nie u kierowcy). Droga 45–75 min (zapas na ruch, nie czas rozkladowy) | <a href=\"https://platanus.hr/dubrovnik-to-airport-shuttle-bus/\" target=\"_blank\" rel=\"noopener\">Platanus — kierunek na lotnisko i rozklad</a> | <a href=\"https://www.google.com/maps/search/?api=1&query=Autobusni%20kolodvor%20Dubrovnik\" target=\"_blank\" rel=\"noopener\">Dworzec Gruz</a> | <a href=\"https://www.google.com/maps/dir/?api=1&origin=Autobusni%20kolodvor%20Dubrovnik&destination=Dubrovnik%20Airport&travelmode=driving\" target=\"_blank\" rel=\"noopener\">Trasa Gruz → DBV</a>"},
{t:"ok. T−3h",d:"Planowany przyjazd na DBV, nadanie wspolnej walizki i kontrola bezpieczenstwa wedlug otwarcia odprawy | <a href=\"https://www.google.com/maps/search/?api=1&query=Dubrovnik%20Airport\" target=\"_blank\" rel=\"noopener\">Lotnisko DBV</a>"},
{t:"T−2h",d:"Posilek, toaleta i spokojne oczekiwanie po kontroli; obserwujcie tablice"},
{t:"T−1h",d:"Sprawdzenie bramki i podejscie zgodnie z terminem podanym przez linie. Nie odkladajcie tego do ostatniej chwili"},
{t:"T",d:"Potwierdzony lot do domu w niedziele 04.07 (Ryanair DBV → POZ latal w niedziele; godzina i numer jeszcze nieznane) | status: <a href=\"https://www.airport-dubrovnik.hr/\" target=\"_blank\" rel=\"noopener\">Lotnisko Dubrownik</a> i aplikacja przewoznika"},
{t:"Po przylocie",d:"Odbior walizki i powrot do domu"}],
w:"Wersja deszczowa to ten sam plan — zmienia sie tylko wiekszy zapas na droge.",
sp:"Wersja skrocona to ten sam plan, bez zwiedzania. Przy poznym wylocie uzgodnijcie przechowanie walizki w hotelu i czas odbioru; wolne godziny na odpoczynek.",
alt:"Przy bardzo wczesnym locie lub braku odpowiedniego kursu Platanus — transfer bezposredni z hotelu.",
note:"<b>Data i lot robocze — brak rezerwacji.</b> T = rzeczywista godzina wylotu; po zakupie lotu przeliczcie punkty na godziny zegarowe, wymogi przewoznika (odprawa, bramka) maja pierwszenstwo. Taryfe, limit bagazu, punkt odbioru i kurs Platanus na 04.07.2027 potwierdzcie przed wyjazdem (zrodla sprawdzone 25.09.2026). Nie jedzcie z walizka pod kolejke tylko dlatego, ze poprzednie dni zaczynaly sie przy starowce."},

];

{e:"🗺️",n:"Rozklad miasta — jak chodzic bez cofania",d:"Organy i Pozdrav Suncu: polnocno-zachodni koniec polwyspu | katedra, sw. Donat i Forum: jeden bliski zespol | targ: wschodnia strona | Fosa i Brama Ladowa zamykaja spacer od poludnia | Kolovare: dalszy odcinek poza murami — laczyc z Fosa, nie wciskac miedzy Forum a Organy"},
{e:"🚶",n:"Start dnia 19.06 zalezy od hotelu",d:"Nocleg na polnocnym koncu: zacznij od katedry/Forum, potem targ i Narodni trg na poludnie — sniadanie w Pjacecie po pierwszym krotkim spacerze | hotel kolo Kolovare: zacznij od poludniowego wejscia na polwysep, na plaze wroc po odpoczynku | nie dokladaj spaceru przez cale miasto tylko dla lokalu | km w planach to szacunki samych spacerow, bez dojsc do hotelu i dworcow"},
{e:"🎟️",n:"Do ustalenia — po ustaleniu obu lotow",d:"4 noce, check-in, walizka przed zameldowaniem | powrot nd. 04.07 — lot do potwierdzenia po publikacji rozkladu 2027"},
{e:"🎟️",n:"Do ustalenia — przy zakupie Plitvic",d:"Zbiorka, wejscie do parku w cenie, dlugosc trasy, posilek, zamiana daty | nie kupowac drugiego biletu parkowego"},
{e:"🎟️",n:"Do ustalenia — przy zakupie rejsu Kornati",d:"Nabrzeze, postoje i czas na ladzie, obiad miesny, wejscia, anulowanie przy wietrze | nazwa „Kornati + Telascica” nie okresla dokladnego programu"},
{e:"🎟️",n:"Do ustalenia — przed dniem 22.06",d:"Autobus do Splitu, dworzec, warunki przewozu walizki | przejazd bez zwiedzania z bagazem"},
{e:"🏺",n:"Muzeum Szkla Antycznego — najlepszy dodatek na deszcz",d:"60–90 min | wschodnia strona starowki | demonstracje pracy ze szklem sprawdz osobno — bilet nie gwarantuje pokazu | odczyt 25.09.2026: dorosly 7 EUR, latem 09:00–21:00 — nie jest to potwierdzenie sezonu 2027 | informacje muzeum",u:"https://www.mas-zadar.hr/hr/o-muzeju/opce-informacije"},
{e:"🌀",n:"Muzeum Iluzji — szybki, lekki dodatek",d:"Poljana Zemaljskog Odbora | 30–45 min | deszczowy zamiennik lub wieczorne urozmaicenie | sprawdz otwarcie i cene na 2027",u:"https://www.google.com/maps/search/?api=1&query=Museum%20of%20Illusions%20Zadar"},
{e:"🍒",n:"Maraschino Maraska — pamiatka z Zadaru",d:"Historyczna stolica likieru z wisni maraski (od XVI w.) | butelka Maraska Original ze sklepow przy starowce, nie na lotnisku | kieliszek: Deja Brew lub po kolacji w Jaderze"},
{e:"🍺",n:"Brlog i Pizzeria Sime — poza starowka",d:"Brlog: spoldzielczy taproom, lokalne APA i IPA | Andrije Hebranga 6 | wieczor dnia 19.06 lub spokojny dzien 21.06 bez wycieczki | Pizzeria Sime pasuje do Boriku, nie do codziennych spacerow po starowce"},
{e:"⛔",n:"Granice planu — czego nie dokladac",d:"Nin albo Paklenica zastepuja pelny dzien (przy Plitvicach i Kornatach zabralyby jedyny pelny dzien miasta) | Krka wypadla: drugi park wodospadow po Plitvicach | Zrmanja wypadla: kajaki lepiej na Cetinie w Omisu (29.06, 20 km od Breli) | Sibenik/Trogir nie sa obowiazkowymi przystankami z walizka w drodze do Splitu"},
{e:"📚",n:"Aktualnosc zrodel i mapy tras",d:"Przeglad atrakcji i transportu: 25.09.2026 | przebudowa programu (bez Zrmanji): 18.10.2026 | zrodla nie potwierdzaja rozkladow, dostepnosci ani cen 2027 | mapy pokazuja kolejnosc punktow, nie pomiar marszu — w centrum trzymaj sie kolejnosci z opisu | po wyborze hotelu dopisz tylko dojscie do pierwszego i powrot z ostatniego punktu"},
]},
split:{h:"Plan pobytu — Split (22–25 czerwca, 3 noce)",
note:"Najwazniejsze: palac Dioklecjana i zycie uliczek, katedra oraz panorama z Vidilicy. Dzien 23.06 to wyspa: Hvar albo Bol na Bracu katamaranem ze Splitu. Rytm: lekki wieczor po przyjezdzie, jeden wyjazd i jeden dzien miejski z odpoczynkiem. 2 osoby, bez auta, dwa male plecaki + wspolna walizka 20 kg — brak rezerwacji. Godziny to okna planowania, nie rozklad 2027.",
l:[
{e:"🧭",n:"Mapa dni — glowny plan i spokojny zamiennik",d:"wt. 22.06, swieto: Zadar → Split, palac i wieczorna starowka | spokojnie: transfer, kolacja i Riva | sr. 23.06: Hvar (twierdza, Pakleni otoci) albo Bol i Zlatni Rat | spokojnie: Bacvice/Ovcice i odpoczynek | czw. 24.06: wnetrza palacu → zachodnia starowka → Marjan | spokojnie: jedno wnetrze i Vidilica"},
{e:"📍",n:"Baza — dolny Varos lub obrzeza palacu",d:"FERMAI i Cornaro pasuja do zwiedzania pieszo | przy Varosu sprawdz, jak wysoko lezy obiekt i ile schodow dzieli go od ulicy dostepnej dla taksowki | samo „centrum” nie gwarantuje wygodnej trasy z walizka"},
{e:"🗺️",n:"Geografia spacerow — co gdzie lezy",d:"Port, dworzec dalekobiezny i Bacvice: na poludniowy wschod od starowki | palac: przy Rivie | Prokurative, Varos i wejscie na Marjan: na zachod | miejskiego dnia nie przecinaj w polowie wyjsciem na plaze po przeciwnej stronie"},
{e:"🚶",n:"Start dnia 24.06 zalezy od hotelu",d:"Nocleg na wschod od palacu: zacznij od Pazaru/Srebrnej Bramy | FERMAI/Cornaro: wejdz od Zlotej Bramy i idz wprost ku Perystylowi | dolny Varos: jedno dojscie do palacu rano, potem powrot przez zachodnia starowke w strone hotelu i Marjanu | bez dodatkowej rundy tylko po to, by zaczac od „pierwszego” punktu mapy | km to szacunki tras bez dojsc do hotelu i przystankow"},
{e:"🎟️",n:"Do ustalenia — autobus Zadar → Split",d:"Data, dworzec, bagaz, godzina przyjazdu | zwiedzanie zaczyna sie po zostawieniu walizki"},
{e:"⛪",n:"Do ustalenia — katedra i podziemia",d:"Aktualne pakiety, otwarcie, ostatnie wejscie | wnetrza rano dnia 24.06, bez uzaleznienia od wieczornych godzin"},
{e:"⛴️",n:"Do ustalenia — katamaran na Hvar / do Bolu",d:"Komercyjne kursy rano tam i po poludniu z powrotem (Krilo, TP Line, Jadrolinija), nabrzeze w Splicie | tanie linie panstwowe plyna w zlych godzinach | szczegoly w planie dnia 23.06"},
{e:"🌲",n:"Do ustalenia — Marjan",d:"Dostepne odcinki, lokalne komunikaty | Vidilica to cel podstawowy, dalszy las to dodatek"},
{e:"🚌",n:"Do ustalenia — Split → Brela",d:"Konkretny przystanek docelowy i odbior z walizka | dzien 25.06 to przejazd, nie wycieczka przez Omis"},
{e:"🔄",n:"Zamiana dni 23.06 i 24.06 — przy wietrze",d:"Dni 23–24.06 mozna zamienic, jesli pozwalaja na to bilety na katamaran | przy silnym wietrze katamarany bywaja odwolywane — wtedy wyspa wypada, a Split zostaje"},
{e:"🏖️",n:"Kasjuni — zamiast Bacvic/Ovcic w spokojnym dniu 23.06",d:"Tylko jesli potwierdzisz wygodny dojazd i powrot | nie dopisuj do dnia wnetrz i Marjanu — zejscie do morza i powrot istotnie zmieniaja wysilek i czas | Bacvice/Ovcice wybierasz dla wygody, nie dlatego, ze sa najpiekniejszymi plazami wyjazdu"},
{e:"🗿",n:"Galeria Mestrovic — uzupelnienie dnia 24.06",d:"Na Marjanie, po drodze na Vidilice | dziela najwazniejszego chorwackiego rzezbiarza XX w. w willi z ogrodem nad morzem | ok. 1 h | zamiast dalszego lasu na Marjanie | osobny bilet, potwierdz godziny",u:"https://mestrovic.hr/en/split-gallery/"},
{e:"🏛️",n:"Trogir — mozliwy zamiennik wyspy w dniu 23.06",d:"Jesli wazniejsza okaze sie architektura niz morze | lokalny autobus ze Splitu | ok. pol dnia"},
{e:"⛔",n:"Swiadome pominiecia — Omis, Cetina, Krka",d:"Omis i Cetina przeniesione do Breli (dzien 29.06, ok. 20 km stamtad) | Krka wypadla jako drugi park wodospadow po Plitvicach"},
{e:"🍽️",n:"Jedzenie — budzet i wybory",d:"Sniadanie 10–14 EUR/os. i danie glowne ok. 25 EUR bez napoju | Villa Spiza: zmienna karta | Sug: sprawdz aktualna cene | Bakra: latwiejsza budzetowo przy pizzy niz steku | Marvlvs na klimat palacowych uliczek, NOOR na jeden koktajl | nie planuj dojazdu przez miasto wylacznie dla baru"},
{e:"➡️",n:"Nastepnego ranka: Brela (piatek 25.06, dzien 25.06)",d:"Sniadanie, wymeldowanie, autobus z potwierdzonego dworca, przejazd bez zwiedzania po drodze | od noclegu do noclegu roboczo 2,5–4 h, zaleznie od kursu i odbioru | przy przystanku przy magistrali D8 ustal transfer/dojscie z walizka — nie zakladaj, ze autobus zjedzie do portu | Arriva — polaczenia",u:"https://www.arriva.com.hr/"},
{e:"📚",n:"Aktualnosc zrodel i korzystanie z map",d:"Przeglad zrodel atrakcji i transportu: 25.09.2026 | wyspa zamiast Omisa/Krki: 18.10.2026 | zrodla potwierdzaja miejsca i zalozenia, nie rozklady, pakiety ani ceny 2027 | mapy pokazuja kolejnosc punktow, czas i dystans to szacunki bez hotelu | przed wyjsciem sprawdz otwarcie wnetrz i pogode, po wyborze hotelu dopisz tylko dojscie do startu i powrot z konca trasy"},
]},
brela:{h:"Plan pobytu — Brela (25–30.06, 5 nocy, bez auta)",
note:"Brela to baza plazowa; z niej dwa wypady (Mostar, Omis z Cetina — tylko 23 km) i opcjonalnie poranna Makarska, pomiedzy nimi dzien plazowy. Z walizka zawsze taksowka lub odbior z hotelu — przystanki sa na D8, 100–130 m nad morzem. Wiele lokali tylko gotowka.",
l:[
{e:"🧭",n:"Mapa dni — szybki wybor",d:"pt 25.06: Split → Brela, Soline i port / krotko: transfer, kolacja w porcie | sob 26.06: Punta Rata → Kamen Brela → Podrace → lunch w LA Bomba / krotko: tylko Punta Rata | nd 27.06: Mostar, ok. 4 h w miescie / krotko: Soline i odpoczynek | pn 28.06: plaza (albo rano Makarska), sjesta, wieczorem promenada do Baski Vody / krotko: tylko Soline | wt 29.06: Omis — Mirabela, soparnik, rejs po Cetinie (albo rafting), pakowanie i pozegnalna kolacja / krotko: Podrace i LA Bomba | Mostar i Omis nie wypadaja dzien po dniu"},
{e:"🗺️",n:"Geografia wybrzeza — od NW na SE",d:"Jakirusa → Stomarica → Scit (LA Bomba) → Podrace → Kamen Brela → Punta Rata → plaza Maestral → Soline → port Brela (centrum, wiekszosc lokali, Konzum) → Loznica (hotel Berulia) → granica gmin → Ikovac → Podluka → Baska Voda (port, plaza Nikolina) | promenada (Lungomare) bez samochodow, prawie plaska, w duzej czesci w cieniu sosen | port → Punta Rata 15–20 min pieszo, do centrum Baski Vody 30–35 min"},
{e:"🚏",n:"Przystanek „Brela” — glowny (staja autobusy dalekobiezne)",d:"D8 przy supermarkecie Ribola, 100–130 m nad morzem | najblizej do: Punta Rata, Podrace, Ivandica Dvori, Sampion | do morza w dol 10–15 min, w gore ok. 20 min"},
{e:"🚏",n:"Przystanek „Brela Soline / Magistrala”",d:"D8 nad centrum, ok. 900 m dalej na poludniowy wschod | najblizej do: port, Soline, Feral, Volat, hotel Berulia | w dol 8–12 min, w gore 15–20 min, stromo"},
{e:"🚌",n:"Autobusy z Breli i taksowki",d:"Split → Brela ok. 60 autobusow dziennie (Promet Makarska, Arriva, Nomago, FlixBus) | do Makarskiej 15–20 min, do Omisa 23–30 min | bilet 3–6 EUR gotowka u kierowcy | z walizka zawsze taksowka albo odbior z hotelu — krotki kurs po Breli ok. 10–15 EUR | taksowki z listy gminy: brela.hr/en/arrival | Promet Makarska: www.promet-makarska.hr",u:"https://brela.hr/en/arrival"},
{e:"🏨",n:"Okolica noclegu — gdzie spac",d:"najlepiej plaski odcinek promenady miedzy Punta Rata a portem (Soline) | drugi wybor: spokojniejsza strona Berulii przy ul. Ivana Gundulica | unikaj ulic nad droga przybrzezna (Fra Bartola Kasica, Kricak, Podcrkavlje) — „300 m od plazy” oznacza tam strome schody"},
{e:"💶",n:"Jedzenie i gotowka",d:"wiele lokali przyjmuje tylko gotowke — bankomaty przy porcie | na Katare i Ivandice Dvori (wyzej nad morzem) umow darmowy dowoz | lista lokali sprawdzona od nowa 18.10.2026 (trzy nazwy z poprzedniej wersji byly bledne)"},
{e:"⛰️",n:"Opcja: Biokovo — Skywalk i Vosac zamiast dnia plazowego 28.06",d:"tylko przy suchej pogodzie, malym wietrze i dobrej widocznosci | bez auta: wycieczka z potwierdzonym dowozem z Breli lub zbiorka w Makarskiej (sam bilet parku nie daje transportu) | trasa: odbior → Skywalk przy Ravna Vlaska → dowoz na parking pod Vosacem → szlak na Vosac i z powrotem → powrot | ok. 1–3 km pieszo, kamieniste podejscie, umiarkowana trudnosc | od gornego parkingu ok. 20 min szlaku; 60–90 min na wejscie, zdjecia i zejscie | okna: 06:30–07:30 sniadanie, 07:30–14:00 odbior i oba postoje, 14:00–15:00 obiad w Breli, 15:00–18:00 odpoczynek, 19:00 kolacja | rezerwuj ok. 6–7 h z Breli | info parku o Vosacu i Skywalku",u:"https://pp-biokovo.hr/hr/istrazi-biokovo/vidikovci"},
{e:"🎫",n:"Biokovo — co uzgodnic przed zakupem",d:"Skywalk + Vosac, rzeczywisty punkt odbioru, dowoz do gornego parkingu, czas na szlak, bilet parku, cena calosci dla 2 os., zasady zmiany terminu przy pogodzie | nie kupuj samodzielnie drugiego biletu, jesli zawiera go wycieczka | park: bilety online, limity wjazdu: pp-biokovo.hr/hr/planiraj-posjet/info-za-posjetitelje | dostepnosc w czerwcu 2027 do potwierdzenia | wariant operatora ponizej",u:"https://www.biokovoexcursion.com/izleti/skywalk-biokovo-i-vosac"},
{e:"🥾",n:"Biokovo — zabierz i czego nie robic",d:"zabierz: pelne buty z dobra podeszwa, wode, przekaske, warstwe na wiatr | odpuszczamy: marsz na Vosac od poziomu morza, dokladanie Sveti Jure, wejscie przy burzy lub silnym wietrze | wariant tylko Skywalk mozliwy po swiadomym wyborze innej oferty, nie jako niezauwazona zamiana kupionego programu",u:"https://pp-biokovo.hr/hr/planiraj-posjet/info-za-posjetitelje"},
{e:"⛪",n:"Opcja: kosciolek Sv. Nikola nad Brela — wycieczka gorska",d:"XIII-wieczny kosciolek na ok. 550–600 m n.p.m. w Parku Biokovo | szlak TZ nr 3 z Gornjego Kricaka przez kaplice Sv. Kajo i skaly Nevistina stina | ok. 6,5 km i 4 h, ok. 700 m podejscia, malo cienia | tylko o swicie, 2 l wody na osobe, zamiast dnia plazowego | krotsza opcja widokowa: Sv. Kajo (szlak nr 2, ok. 2 h)",u:"https://brela.hr/en/active-holidays/easier-mountain-trails"},
{e:"⛱️",n:"Lezaki",d:"cien pod sosnami darmowy | Maestral Beach Club przy Punta Racie: 2 lezaki ok. 35 EUR dziennie"},
{e:"📋",n:"Do ustalenia przed pobytem",d:"nocleg 25–30.06 (5 nocy): odbior z przystanku lub taksowka, rzeczywista droga do morza bez schodow, klimatyzacja, anulacja | autobusy Split → Brela i Brela → Dubrownik: konkretny kurs i przystanek wysiadki/wsiadki w Breli, walizka 20 kg wg zasad przewoznika | Mostar: oferta z odbiorem w Breli, ok. 4 h w Mostarze, kurs w niedziele 27.06, cena calosci, dokumenty | Omis: rejs po Cetinie na miejscu; rafting lub canyoning — rezerwacja kilka dni wczesniej | kolacje: Feral (kilka dni wczesniej), Volat, Bracera; peka w Katarze dzien wczesniej, z dowozem; Ivandica Dvori z dowozem"},
{e:"🚌",n:"30.06 — wyjazd do Dubrownika",d:"rano taksowka z walizka na przystanek z biletu (zwykle glowny „Brela”) | preferowany kurs bezposredni; bez niego — sprawdzona przesiadka w Makarskiej | planistycznie 4,5–6,5 h od drzwi do drzwi | Neum: czesc autobusow przejezdza przez Bosnie i Hercegowine z kontrola graniczna — dowod lub paszport przy sobie, nie w walizce w luku; kursy przez most Peljesac omijaja granice"},
{e:"⛴️",n:"Opcja: morzem do Dubrownika — Kapetan Luka (Krilo) z Makarskiej",d:"linia Split – Bol – Makarska – Korcula – Mljet – Dubrownik | Makarska 15–20 min od Breli | widokowa alternatywa dla autobusu przez Neum | rozklad i bagaz na czerwiec 2027 do sprawdzenia zima/wiosna",u:"https://www.krilo.hr/hr/schedule"},
]},
dubrovnik:{h:"Plan pobytu — mury, zielone Lokrum i spokojny final",
note:"4 noce (30.06–04.07). Jeden wyjazd do centrum i jeden powrot dziennie (hotel w Lapadzie/Gruzu/Boninovie). Po przyjezdzie sprawdzcie pogode: Lokrum na dzien z dzialajacymi rejsami, mury na suchy poranek, Lopud na spokojne morze — dni 01.07, 02.07 i 3.07 sa zamienne, wiec bilety kupujcie z mozliwoscia zmiany daty.",
l:[
{e:"🧭",n:"Najlepszy uklad pobytu — mury, Lokrum i Lopud zamienne",d:"30.06: pierwszy wieczor na starowce | 01.07: suchy poranek na murach | 02.07: Lokrum | 03.07: Lopud i plaza Sunj | 04.07: powrot | trzy pelne dni mozna zamieniac wedlug morza i pogody | Palac Rektorow = plan na deszcz | Srd = opcja zastepujaca czesc dnia 01.07 | daty robocze, brak rezerwacji | zrodla sprawdzone 25.09.2026, godziny w dniach to okna do planowania, nie potwierdzony rozklad 2027"},
{e:"🌦",n:"Kolejnosc wedlug pogody — decyzja po przyjezdzie",d:"Sprawdzcie trzy pelne dni | pierwszenstwo na Lokrum ma dzien z dzialajacymi rejsami i dobrymi warunkami | mury na drugi suchy poranek | kupujac bilety na date, uzgodnijcie mozliwosc zamiany przed oplaceniem | woda, cien i odpoczynek takze po zmianie kolejnosci"},
{e:"🏨",n:"Okolica noclegu — jeden wyjazd do centrum i jeden powrot dziennie",d:"Tansze dobre hotele sa w Lapadzie, Gruzu i na Boninovie | przy starowce hotele 300–450 EUR za noc | dlatego posilek na siedzaco i wczesniejszy koniec dnia zamiast sjesty w pokoju | noclegi: tylko hotele (18.10.2026)"},
{e:"🚶",n:"Lero / Boninovo — do Pile 20–25 min pieszo",d:"Albo 5–10 min autobusem 4/6 | najblizej z tanszych | sjesta mozliwa"},
{e:"🚌",n:"Ivka / Lapad — autobus 6 ok. 15 min do Pile",d:"Najlepsza ocena w cenie | jeden blok w centrum dziennie"},
{e:"🧳",n:"Berkeley / Gruz — autobus 1A/1B/3 ok. 10–15 min do Pile",d:"Kilka minut od dworca Gruz | najlatwiejszy przyjazd z walizka"},
{e:"✈",n:"Porto / Montovjerna — autobus ponizej 10 min do Pile",d:"Przy przystanku Grawe (shuttle na lotnisko)"},
{e:"🚏",n:"Autobusy miejskie Libertas — sprawdz po wyborze hotelu",d:"Czasy dojazdu to szacunki z polozenia, nie gwarantowane kursy | sprawdzcie trase, przystanek w obu kierunkach i ostatni autobus | korki i kolejka przy Pile moga wydluzyc powrot | na poranek murow zapas albo taksowka do dozwolonego punktu wysiadania przy centrum",u:"https://libertasdubrovnik.hr/"},
{e:"📍",n:"Trzy rozne miejsca: Gruz, Pile i stary port",d:"Dworzec autobusowy Gruz = przyjazd z Riwiery | przystanki Pile = na zachod od starowki | lodz na Lokrum = stary port po wschodniej stronie starowki | Pile → stary port ok. 15–20 min spokojnego przejscia, wiecej z tlumem | walizka zostaje w hotelu"},

function gc(id){const r=localStorage.getItem('cro_'+id);if(!r)return new Array(D.find(d=>d.id===id).i.length).fill(false);return JSON.parse(r)}

// === RENDER (only once on load) ===
function render(){
  for(const[c,m]of Object.entries(M)){
    const sec=document.getElementById('s-'+c),days=D.filter(d=>d.c===c);
    let h=`<div class="ci"><div class="cl ${c}">${m.n}</div><h2>${m.sub}</h2><p class="cm">${m.dt}</p></div>`;
    for(const day of days){
      const ch=gc(day.id),dn=ch.filter(Boolean).length,tot=day.i.length,ok=dn===tot&&tot>0;
      h+=`<div class="dc${ok?' dn':''}" id="d${day.id}">`;
      h+=`<div class="dh" onclick="td(${day.id})"><div class="dd ${c}">${day.id}</div>`;
      h+=`<div class="dh-i"><div class="dh-dt">${day.dt}</div><div class="dh-t">${day.t}</div><div class="dh-s">${day.s}</div></div>`;
      h+=`<div class="dh-r"><span class="dh-p" id="p${day.id}">${dn}/${tot}</span><span class="dh-a">›</span></div></div>`;
      h+=`<div class="db"><div class="db-in"><div class="db-dv"></div>`;
      for(let i=0;i<day.i.length;i++){
        const it=day.i[i],on=ch[i];
        h+=`<div class="ti${on?' ck':''}" id="ti${day.id}_${i}"><div class="tl"><div class="tc${on?' on':''}" onclick="tc(${day.id},${i},event)"></div></div>`;
        // find photo match
        let wiki='';
        for(const[kw,wt]of Object.entries(PHOTOS)){if(it.d.includes(kw)||it.t.includes(kw)){wiki=wt;break}}
        h+=`<div class="ti-wrap">`;
        h+=`<div class="ti-c"><div class="ti-t">${it.t}</div><div class="ti-d">${it.d}</div>`;
        if(it.r)h+=`<div class="rc"><span class="ri">🍽</span><div><div class="rn">${it.r.n}</div><div class="rd">${it.r.d}</div></div></div>`;
        h+=`</div>`;
        if(wiki)h+=`<img class="ti-ph" data-wiki="${wiki}" alt="" onclick="openLb(this,event)" loading="lazy">`;
        h+=`</div></div>`;
      }
      if(day.w)h+=`<div class="wn"><span>🌧</span><span>${day.w}</span></div>`;
      if(day.sp)h+=`<div class="sn"><span>😌</span><span><b>Spokojniej:</b> ${day.sp}</span></div>`;
      if(day.alt)h+=`<div class="sn"><span>🔄</span><span>${day.alt}</span></div>`;
      if(day.note)h+=`<div class="wn"><span>⚠️</span><span>${day.note}</span></div>`;
      h+=`</div></div></div>`;
    }
    h+=listCard('🗺',PLAN[c]);
    h+=listCard('🚌',PRZ[c]);
    h+=listCard('🛏',NOC[c]);
    h+=listCard('🍽',JED[c]);
    if(WYC[c])h+=listCard(WYC[c].e,WYC[c]);
    sec.innerHTML=h;
  }
  renderMore();up();
}

// === KARTY LIST (PLAN, PRZ, NOC, JED, WYC, INFO) — pozycje z polem k sa grupowane ===
function listCard(icon,b){
  if(!b)return '';
  const mi=x=>`<div class="mi"><span class="me">${x.e||''}</span><div><div class="mn">${x.n}</div><div class="md">${x.d||''}${x.u?` | <a href="${x.u}" target="_blank" rel="noopener">link</a>`:''}</div></div></div>`;
  let h=`<div class="mc noc"><h3>${icon} ${b.h}</h3>`,k=null;
  for(const x of b.l){if(x.k&&x.k!==k){k=x.k;h+=`<div class="mk">${k}</div>`}h+=mi(x)}
  if(b.note)h+=`<div class="nt">${b.note}</div>`;
  return h+`</div>`;
}

// === CHECKBOX TOGGLE — no re-render, no closing! ===
function tc(dayId,idx,e){
  e.stopPropagation();
  const ch=gc(dayId);
  ch[idx]=!ch[idx];
  localStorage.setItem('cro_'+dayId,JSON.stringify(ch));

  // Update just this item
  const item=document.getElementById('ti'+dayId+'_'+idx);
  const box=item.querySelector('.tc');
  if(ch[idx]){box.classList.add('on');item.classList.add('ck')}
  else{box.classList.remove('on');item.classList.remove('ck')}

  // Update counter
  const dn=ch.filter(Boolean).length,tot=ch.length,ok=dn===tot;
  const pEl=document.getElementById('p'+dayId);
  pEl.textContent=dn+'/'+tot;

  // Update card done state
  const card=document.getElementById('d'+dayId);
  if(ok){card.classList.add('dn');pEl.closest('.dh-r')&&pEl.classList.add('ok')}
  else{card.classList.remove('dn')}

  up();
}

// td() and go() defined below with photo support

function up(){
  let t=0,d=0;
  for(const day of D){const ch=gc(day.id);t+=ch.length;d+=ch.filter(Boolean).length}
  const p=t?Math.round(d/t*100):0;
  document.getElementById('np').textContent=p+'%';
  document.getElementById('nf').style.width=p+'%';
  document.getElementById('hp').textContent=p+'%';
}

// === LIGHTBOX ===
function openLb(img,e){
  e.stopPropagation();
  const lb=document.getElementById('lb');
  document.getElementById('lb-img').src=img.src.replace(/\/\d+px-/,'/800px-');
  document.getElementById('lb-cap').textContent=img.alt||'';
  lb.classList.add('show');
}

// === PHOTO SYSTEM ===
let photoCache={};
try{photoCache=JSON.parse(localStorage.getItem('cro_ph')||'{}')}catch(e){}

async function getPhotoUrl(wikiTitle){
  if(photoCache[wikiTitle]) return photoCache[wikiTitle];
  try{
    const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(wikiTitle));
    if(!r.ok) return null;
    const j=await r.json();
    if(j.thumbnail&&j.thumbnail.source){
      const url=j.thumbnail.source.replace(/\/\d+px-/,'/400px-');
      photoCache[wikiTitle]={url,alt:j.displaytitle||wikiTitle.replace(/_/g,' ')};
      try{localStorage.setItem('cro_ph',JSON.stringify(photoCache))}catch(e){}
      return photoCache[wikiTitle];
    }
  }catch(e){}
  return null;
}

function applyPhotos(){
  document.querySelectorAll('img[data-wiki]').forEach(async img=>{
    if(img.classList.contains('loaded')) return;
    const wt=img.dataset.wiki;
    const cached=photoCache[wt];
    if(cached){
      img.src=cached.url;img.alt=cached.alt;img.classList.add('loaded');
    } else {
      const data=await getPhotoUrl(wt);
      if(data){img.src=data.url;img.alt=data.alt;img.classList.add('loaded')}
    }
  });
}

// Pre-fetch all unique wiki titles on load
async function prefetchPhotos(){
  const allTitles=[...new Set(Object.values(PHOTOS))];
  const missing=allTitles.filter(t=>!photoCache[t]);
  await Promise.all(missing.map(t=>getPhotoUrl(t)));
  applyPhotos();
}

render();
prefetchPhotos();

// Also apply photos whenever a day is opened (for hidden sections)
const origTd=td;
function td(id){
  const el=document.getElementById('d'+id),w=el.classList.contains('op');
  el.closest('.sec').querySelectorAll('.dc.op').forEach(d=>d.classList.remove('op'));
  if(!w){el.classList.add('op');setTimeout(()=>{applyPhotos();el.scrollIntoView({behavior:'smooth',block:'nearest'})},50)}
}

// Apply when switching tabs too
const origGo=go;
function go(btn){
  const c=btn.dataset.c;
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.getElementById('s-'+c).classList.add('on');
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  window.scrollTo({top:document.getElementById('tn').offsetTop,behavior:'smooth'});
  setTimeout(applyPhotos,100);
}
