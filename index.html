<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRO 2027">
<meta name="theme-color" content="#0c1220">
<title>Chorwacja 2027 — Plan podrozy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--f-sans:'DM Sans',system-ui,sans-serif;--f-serif:'Playfair Display',Georgia,serif;
--z:#0ea5e9;--s:#a855f7;--b:#f97316;--d:#10b981;
--bg:#fafaf9;--card:#fff;--brd:#e7e5e4;--txt:#1c1917;--txt2:#78716c;--txt3:#a8a29e;
--r:16px;--sh:0 1px 3px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.06);
}
html{font-family:var(--f-sans);color:var(--txt);scroll-behavior:smooth;background:var(--bg)}
body{overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:var(--f-sans);cursor:pointer;border:none;background:none}

/* === HERO === */
.hero{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;
position:relative;overflow:hidden;background:#0c1220;color:#fff;text-align:center;padding:40px 24px}

.hero-bg{position:absolute;inset:0;
background:linear-gradient(135deg,#0c1220 0%,#164e63 30%,#0e7490 50%,#0891b2 65%,#f59e0b 85%,#ea580c 100%);
opacity:.7;animation:hero-shift 20s ease-in-out infinite alternate}
@keyframes hero-shift{0%{filter:hue-rotate(0deg) brightness(1)}50%{filter:hue-rotate(-15deg) brightness(1.1)}100%{filter:hue-rotate(10deg) brightness(.95)}}

.hero-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 80%,rgba(0,0,0,.3),transparent 70%)}

.hero-content{position:relative;z-index:1;max-width:800px}
.hero-flag{font-size:56px;margin-bottom:20px;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}
.hero h1{font-family:var(--f-serif);font-size:clamp(36px,7vw,72px);font-weight:800;line-height:1.1;
letter-spacing:-1px;margin-bottom:12px;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.hero .subtitle{font-size:clamp(14px,2.5vw,20px);opacity:.7;font-weight:400;margin-bottom:36px;letter-spacing:1px}

.hero-stats{display:flex;gap:32px;justify-content:center;flex-wrap:wrap;margin-bottom:40px}
.hero-stat{text-align:center}
.hero-stat .val{font-family:var(--f-serif);font-size:clamp(28px,4vw,44px);font-weight:700;display:block;line-height:1.2}
.hero-stat .label{font-size:12px;opacity:.5;text-transform:uppercase;letter-spacing:2px;margin-top:2px}

.hero-route{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;font-size:clamp(13px,2vw,16px);font-weight:600;opacity:.8}
.hero-route .arrow{opacity:.3;font-size:18px}

.hero-scroll{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);z-index:1;
font-size:12px;opacity:.4;letter-spacing:2px;text-transform:uppercase;
animation:bounce-down 2s ease-in-out infinite}
@keyframes bounce-down{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

/* === TOP NAV (sticky) === */
.topnav{position:sticky;top:0;z-index:50;background:rgba(250,250,249,.85);
backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
border-bottom:1px solid var(--brd);padding:0 24px;transition:box-shadow .3s}
.topnav.scrolled{box-shadow:0 1px 8px rgba(0,0,0,.06)}

.topnav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;height:56px;gap:8px}
.topnav-brand{font-family:var(--f-serif);font-weight:700;font-size:18px;margin-right:auto;white-space:nowrap}
.topnav-brand span{opacity:.4;font-weight:400}

.tnav-btn{padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;color:var(--txt2);
transition:all .2s;white-space:nowrap}
.tnav-btn:hover{background:rgba(0,0,0,.04)}
.tnav-btn.on{color:var(--txt);background:rgba(0,0,0,.06)}

.tnav-progress{display:flex;align-items:center;gap:8px;margin-left:12px}
.tnav-pct{font-size:13px;font-weight:700;color:var(--d)}
.tnav-bar{width:80px;height:4px;background:var(--brd);border-radius:2px;overflow:hidden}
.tnav-fill{height:100%;border-radius:2px;background:var(--d);transition:width .5s}

@media(max-width:768px){
  .tnav-btn{padding:6px 10px;font-size:12px}
  .tnav-progress{display:none}
  .topnav-inner{gap:2px}
}

/* === SECTION === */
.sec{display:none;max-width:900px;margin:0 auto;padding:32px 20px 80px}
.sec.on{display:block}

/* === CITY INTRO === */
.city-intro{margin-bottom:32px;padding:40px 0 32px;border-bottom:1px solid var(--brd)}
.city-intro .ci-label{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
.city-intro .ci-label.zadar{color:var(--z)}.ci-label.split{color:var(--s)}.ci-label.brela{color:var(--b)}.ci-label.dubrovnik{color:var(--d)}
.city-intro h2{font-family:var(--f-serif);font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.15;letter-spacing:-1px;margin-bottom:6px}
.city-intro .ci-meta{font-size:15px;color:var(--txt2)}

/* === DAY CARD === */
.day-card{position:relative;margin-bottom:16px;background:var(--card);border:1px solid var(--brd);
border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:all .25s}
.day-card:hover{box-shadow:0 2px 6px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.08)}
.day-card.done{border-color:rgba(16,185,129,.25);background:linear-gradient(135deg,#f0fdf4,#ecfdf5)}

/* day header */
.day-hdr{display:flex;align-items:center;gap:14px;padding:18px 20px;cursor:pointer;-webkit-user-select:none}
.day-dot{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
font-family:var(--f-serif);font-weight:800;font-size:16px;color:#fff;flex-shrink:0}
.day-dot.zadar{background:var(--z)}.day-dot.split{background:var(--s)}.day-dot.brela{background:var(--b)}.day-dot.dubrovnik{background:var(--d)}
.day-card.done .day-dot{background:var(--d)}

.day-hdr-info{flex:1;min-width:0}
.day-hdr-date{font-size:12px;color:var(--txt3);font-weight:600;margin-bottom:2px}
.day-hdr-title{font-size:16px;font-weight:700;line-height:1.3}
.day-hdr-sub{font-size:13px;color:var(--txt2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.day-hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.day-hdr-pct{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;background:#f5f5f4;color:var(--txt3)}
.day-card.done .day-hdr-pct{background:rgba(16,185,129,.1);color:var(--d)}
.day-hdr-arrow{font-size:20px;color:var(--txt3);transition:transform .3s}
.day-card.open .day-hdr-arrow{transform:rotate(90deg)}

/* day body */
.day-body{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.4,0,.2,1)}
.day-card.open .day-body{max-height:5000px}

.day-inner{padding:0 20px 24px}
.day-divider{height:1px;background:var(--brd);margin-bottom:20px}

/* === TIMELINE ITEMS === */
.tl-item{display:flex;gap:14px;position:relative;padding-bottom:16px}
.tl-item:last-of-type{padding-bottom:0}

/* vertical line */
.tl-line{position:relative;width:20px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.tl-line::before{content:'';position:absolute;top:12px;bottom:0;width:1.5px;background:var(--brd)}
.tl-item:last-of-type .tl-line::before{display:none}

.tl-check{width:20px;height:20px;border:2px solid #d6d3d1;border-radius:6px;background:#fff;
cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:1;flex-shrink:0}
.tl-check:hover{border-color:#a8a29e}
.tl-check:active{transform:scale(.9)}
.tl-check.on{background:var(--d);border-color:var(--d)}
.tl-check.on::after{content:'';width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

.tl-content{flex:1;min-width:0;padding-top:1px}
.tl-time{font-size:12px;font-weight:700;color:var(--txt);margin-bottom:2px}
.tl-desc{font-size:14px;color:var(--txt2);line-height:1.5}
.tl-item.checked .tl-desc{text-decoration:line-through;opacity:.4}

/* === RESTAURANT CARD === */
.resto-card{display:flex;gap:12px;background:#fffbeb;border:1px solid #fef3c7;border-radius:12px;
padding:12px 14px;margin:8px 0 4px}
.resto-card .rc-icon{font-size:22px;flex-shrink:0}
.resto-card .rc-name{font-weight:700;font-size:14px;color:var(--txt)}
.resto-card .rc-desc{font-size:12px;color:var(--txt2);margin-top:2px;line-height:1.4}

/* === WEATHER === */
.weather-note{display:flex;gap:10px;background:#f0f9ff;border:1px solid #e0f2fe;border-radius:12px;
padding:12px 14px;margin-top:16px;font-size:13px;color:#0c4a6e;line-height:1.5}
.weather-note span:first-child{flex-shrink:0;font-size:16px}

/* === MORE SECTION === */
.more-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.more-card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.more-card h3{font-family:var(--f-serif);font-size:20px;font-weight:700;margin-bottom:16px}
.more-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f5f5f4}
.more-item:last-child{border-bottom:none}
.more-item .mi-emoji{font-size:20px;flex-shrink:0;width:28px;text-align:center}
.more-item .mi-name{font-weight:700;font-size:13px}
.more-item .mi-desc{font-size:12px;color:var(--txt2)}

.phrase-tbl{width:100%;border-collapse:collapse;font-size:13px}
.phrase-tbl th{text-align:left;padding:8px 4px;font-size:11px;color:var(--txt3);border-bottom:2px solid var(--brd);font-weight:700}
.phrase-tbl td{padding:8px 4px;border-bottom:1px solid #f5f5f4}
.phrase-tbl td:last-child{color:var(--txt2);font-style:italic}

/* === FOOTER === */
.footer{text-align:center;padding:48px 24px;border-top:1px solid var(--brd);color:var(--txt3);font-size:13px}
.footer .ft-flag{font-size:32px;margin-bottom:8px;display:block}
.footer b{color:var(--txt)}

/* === RESPONSIVE === */
@media(max-width:640px){
  .hero-stats{gap:20px}
  .hero-route{font-size:13px;gap:8px}
  .city-intro{padding:24px 0 20px}
  .day-hdr{padding:14px 16px;gap:10px}
  .day-inner{padding:0 16px 20px}
  .more-grid{grid-template-columns:1fr}
}
</style>
</head>

const META={

brela:{name:'Brela',sub:'Najpiekniejsze plaze Riwiery Makarskiej',dates:'9-15 czerwca | 6 nocy | dni 8-13'},

};

function gc(id){const r=localStorage.getItem('cro_'+id);if(!r)return new Array(D.find(d=>d.id===id).i.length).fill(false);return JSON.parse(r)}

function render(){
  for(const[c,m]of Object.entries(META)){
    const sec=document.getElementById('s-'+c),days=D.filter(d=>d.c===c);
    let h=`<div class="city-intro"><div class="ci-label ${c}">${m.name}</div><h2>${m.sub}</h2><p class="ci-meta">${m.dates}</p></div>`;
    for(const day of days){
      const ch=gc(day.id),dn=ch.filter(Boolean).length,tot=day.i.length,ok=dn===tot&&tot>0;
      h+=`<div class="day-card${ok?' done':''}" id="d${day.id}">`;
      h+=`<div class="day-hdr" onclick="td(${day.id})"><div class="day-dot ${c}">${day.id}</div>`;
      h+=`<div class="day-hdr-info"><div class="day-hdr-date">${day.dt}</div><div class="day-hdr-title">${day.t}</div><div class="day-hdr-sub">${day.s}</div></div>`;
      h+=`<div class="day-hdr-right"><span class="day-hdr-pct">${dn}/${tot}</span><span class="day-hdr-arrow">›</span></div></div>`;
      h+=`<div class="day-body"><div class="day-inner"><div class="day-divider"></div>`;
      for(let i=0;i<day.i.length;i++){
        const it=day.i[i],on=ch[i];
        h+=`<div class="tl-item${on?' checked':''}"><div class="tl-line"><div class="tl-check${on?' on':''}" onclick="tc(${day.id},${i},event)"></div></div>`;
        h+=`<div class="tl-content"><div class="tl-time">${it.t}</div><div class="tl-desc">${it.d}</div>`;
        if(it.r)h+=`<div class="resto-card"><span class="rc-icon">🍽</span><div><div class="rc-name">${it.r.n}</div><div class="rc-desc">${it.r.d}</div></div></div>`;
        h+=`</div></div>`;
      }
      if(day.w)h+=`<div class="weather-note"><span>🌧</span><span>${day.w}</span></div>`;
      h+=`</div></div></div>`;
    }
    sec.innerHTML=h;
  }
  renderMore();up();
}

function tc(id,i,e){e.stopPropagation();const ch=gc(id);ch[i]=!ch[i];localStorage.setItem('cro_'+id,JSON.stringify(ch));render()}
function td(id){const el=document.getElementById('d'+id),w=el.classList.contains('open');el.closest('.sec').querySelectorAll('.day-card.open').forEach(d=>d.classList.remove('open'));if(!w){el.classList.add('open');setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'nearest'}),100)}}

function go(c){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.getElementById('s-'+c).classList.add('on');
  document.querySelectorAll('.tnav-btn').forEach(b=>b.classList.remove('on'));
  event.target.classList.add('on');
  window.scrollTo({top:document.getElementById('topnav').offsetTop,behavior:'smooth'});
}

function up(){
  let t=0,d=0;
  for(const day of D){const ch=gc(day.id);t+=ch.length;d+=ch.filter(Boolean).length}
  const p=t?Math.round(d/t*100):0;
  document.getElementById('navPct').textContent=p+'%';
  document.getElementById('navFill').style.width=p+'%';
  document.getElementById('heroPct').textContent=p+'%';
}

// sticky nav shadow
const nav=document.getElementById('topnav');
window.addEventListener('scroll',()=>{nav.classList.toggle('scrolled',window.scrollY>10)});

render();
</script>
